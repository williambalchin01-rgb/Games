<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151C24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Arcade</title>
<link rel="stylesheet" href="./app.css">
<style>
  .title{font-size:30px;font-weight:200;letter-spacing:-.02em;margin-top:2px}
  .menu{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 0 0}
  .game{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;transition:border-color .12s ease, transform .12s ease;
  }
  .game:hover,.game:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
  .game h2{margin:0 0 3px;font-size:17px;font-weight:500}
  .game p{margin:0;font-size:13px;color:var(--muted)}
  .game .meta{margin-top:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
  .art{flex:none;width:52px;height:52px}
  .art rect{rx:2}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Play</div>
    <div class="title">Arcade</div>
  </div>
</header>

<div class="menu">

  <a class="game" href="./blocks.html">
    <svg class="art" viewBox="0 0 52 52" aria-hidden="true">
      <rect x="2"  y="2"  width="14" height="14" fill="#4A86D1"/>
      <rect x="19" y="2"  width="14" height="14" fill="#4A86D1"/>
      <rect x="36" y="2"  width="14" height="14" fill="#2C3945"/>
      <rect x="2"  y="19" width="14" height="14" fill="#2C3945"/>
      <rect x="19" y="19" width="14" height="14" fill="#E8CF5C"/>
      <rect x="36" y="19" width="14" height="14" fill="#E8CF5C"/>
      <rect x="2"  y="36" width="14" height="14" fill="#4FA88B"/>
      <rect x="19" y="36" width="14" height="14" fill="#2C3945"/>
      <rect x="36" y="36" width="14" height="14" fill="#2C3945"/>
    </svg>
    <div>
      <h2>Blocks</h2>
      <p>Drop shapes to fill rows, columns and boxes. Keep going as long as they fit.</p>
      <div class="meta" id="blocks-meta"></div>
    </div>
  </a>

  <a class="game" href="./decant.html">
    <svg class="art" viewBox="0 0 52 52" aria-hidden="true">
      <path d="M6 6 v34 a7 7 0 0 0 12 0 V6" fill="none" stroke="#2C3945" stroke-width="3"/>
      <path d="M34 6 v34 a7 7 0 0 0 12 0 V6" fill="none" stroke="#2C3945" stroke-width="3"/>
      <rect x="8"  y="26" width="8" height="18" fill="#E0574A"/>
      <rect x="36" y="20" width="8" height="24" fill="#4FA88B"/>
    </svg>
    <div>
      <h2>Decant</h2>
      <p>Pour colours between tubes until each one holds a single shade.</p>
      <div class="meta" id="decant-meta"></div>
    </div>
  </a>

</div>

<p class="note">Works offline. Add it to your home screen to play like an app.</p>

<script>
(function(){
  "use strict";

  // Show a line of progress under each game when there is something to report.
  function read(key){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }

  var b = read("arcade.blocks.v1");
  if(b){
    var bits = [];
    if(b.best) bits.push("Best " + b.best);
    if(b.score) bits.push("Game in progress · " + b.score);
    document.getElementById("blocks-meta").textContent = bits.join("  ·  ");
  }

  var d = read("decant.v1");
  if(d && d.tubes){
    var moves = (d.history || []).length;
    var label = d.level ? d.level.charAt(0).toUpperCase() + d.level.slice(1) : "";
    document.getElementById("decant-meta").textContent =
      moves ? label + " · " + moves + (moves === 1 ? " move in" : " moves in") : label;
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }
})();
</script>
</body>
</html>
