<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151C24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Iron Oath</title>
<link rel="stylesheet" href="./app.css">
<style>
  #app{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
  .boardrow{position:relative}
  canvas#board{display:block;margin:0 auto;border-radius:8px;touch-action:manipulation;background:#10161C}
  .unitbar{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;min-height:52px;font-size:12.5px}
  .unitbar .nm{font-size:14px}
  .unitbar small{color:var(--muted);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:6px}
  .acts button{flex:1;padding:11px 4px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:12.5px}
  .acts button[data-on="true"]{border-color:var(--sel);color:var(--sel)}
  .acts button:disabled{color:var(--line)}
  .log{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:12.5px;min-height:62px;max-height:150px;overflow-y:auto}
  .log .line{margin-bottom:4px}
  .dice{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
  .die{width:17px;height:17px;border-radius:4px;font-size:11px;line-height:17px;text-align:center;font-weight:600;background:#2C3945;color:#6C7A87}
  .die[data-ok="true"]{background:#E6EBEF;color:#151C24}
  .step{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px;color:var(--muted)}
  .step b{color:var(--ink);font-weight:500;min-width:62px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .panel h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .panel p{margin:0 0 6px;font-size:13.5px;line-height:1.45}
  .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
  .row:last-child{border-bottom:none}
  .row small{color:var(--muted);font-size:11.5px;display:block}
  .tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:2px 7px;color:var(--muted);white-space:nowrap}
  .tag[data-k="dead"]{color:#E0574A;border-color:rgba(224,87,74,.5)}
  .tag[data-k="rank"]{color:var(--sel);border-color:rgba(224,164,88,.5)}
  .btn{width:100%;padding:13px;border:1px solid var(--accent);color:var(--accent);border-radius:var(--radius);background:var(--surface);font-size:14px}
  .scroll{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .die[data-roll="true"]{background:#3A4652;color:#AFBAC4;transform:rotate(8deg)}
  .cnt{font-size:11.5px;color:var(--muted);margin-left:4px}
  .out[data-bad="true"]{color:#E0574A}
  .srow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow canvas{flex:none;border-radius:8px}
  .sbody{flex:1;min-width:0;font-size:13.5px}
  .sbody small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .sbody .st[data-bad="true"]{color:#E0574A}
  .card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .card canvas{flex:none;border-radius:10px}
  .cbody{flex:1;min-width:0}
  .cname{font-size:18px;font-weight:300}
  .cbody small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .trait{font-size:12.5px;margin-top:8px;line-height:1.4}
  .quote{font-size:12.5px;margin-top:6px;font-style:italic;color:#AFBAC4}
  .stats{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:6px}
  .stats b{display:block;font-size:16px;font-weight:400}
  .stats small{font-size:10px;letter-spacing:.1em;color:var(--muted)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:12.5px}
  .seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  #mini{flex:none;border-radius:6px}
  .banner{text-align:center;padding:18px 10px}
  .banner h2{margin:0 0 6px;font-weight:300;font-size:24px}
  .banner p{margin:0;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<header>
  <a class="back" href="./index.html">&larr; Arcade</a>
  <button class="chip" id="restart">New campaign</button>
</header>
<div id="app"></div>
<script src="./sw-boot.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------
     THE RULES

     Skirmish rules in the 40k mould: a squad of five against a horde, on a
     grid, taking turns one model at a time. Every attack goes hit, wound,
     save, damage, with the dice shown. Ranges and moves are in tiles.
     --------------------------------------------------------------------- */
  var COLS = 10, ROWS = 14, ROUNDS = 5;

  var WEAPONS = {
    bolter:  { name:"Bolt rifle",     range:8,  A:2, S:4, AP:0,  D:1, rapid:true },
    pistol:  { name:"Bolt pistol",    range:4,  A:1, S:4, AP:0,  D:1, pistol:true },
    heavy:   { name:"Heavy bolter",   range:10, A:3, S:5, AP:-1, D:2, heavy:true },
    marksman:{ name:"Marksman rifle", range:12, A:1, S:5, AP:-2, D:3, heavy:true },
    knife:   { name:"Combat knife",   melee:true, A:3, S:4, AP:0,  D:1 },
    sword:   { name:"Chainsword",     melee:true, A:4, S:4, AP:-1, D:1 },
    slugga:  { name:"Slugga",         range:4,  A:1, S:4, AP:0,  D:1, pistol:true },
    shoota:  { name:"Shoota",         range:6,  A:2, S:4, AP:0,  D:1 },
    rokkit:  { name:"Rokkit",         range:10, A:1, S:9, AP:-2, D:3, heavy:true },
    choppa:  { name:"Choppa",         melee:true, A:3, S:4, AP:-1, D:1 },
    klaw:    { name:"Power klaw",     melee:true, A:3, S:9, AP:-2, D:2, clumsy:true },
    bigklaw: { name:"Boss klaw",      melee:true, A:5, S:9, AP:-2, D:2, clumsy:true }
  };

  // M moves, WS/BS hit on that or better, T toughness, W wounds, Sv save
  var KINDS = {
    sgt:    { side:"p", name:"Sergeant",      tag:"S", M:3, WS:2, BS:3, T:4, W:3, Sv:3, ranged:"pistol",  melee:"sword" },
    bro:    { side:"p", name:"Battle-brother",tag:"B", M:3, WS:3, BS:3, T:4, W:2, Sv:3, ranged:"bolter",  melee:"knife" },
    gunner: { side:"p", name:"Heavy gunner",  tag:"H", M:2, WS:3, BS:3, T:4, W:2, Sv:3, ranged:"heavy",   melee:"knife" },
    sniper: { side:"p", name:"Marksman",      tag:"M", M:3, WS:3, BS:2, T:4, W:2, Sv:3, ranged:"marksman",melee:"knife" },
    boy:    { side:"e", name:"Grukk boy",     tag:"b", M:3, WS:3, BS:5, T:5, W:1, Sv:6, ranged:"slugga",  melee:"choppa" },
    shoot:  { side:"e", name:"Grukk shoota",  tag:"s", M:3, WS:4, BS:5, T:5, W:1, Sv:6, ranged:"shoota",  melee:"choppa" },
    rokkit: { side:"e", name:"Rokkit grukk",  tag:"r", M:2, WS:4, BS:5, T:5, W:1, Sv:6, ranged:"rokkit",  melee:"choppa" },
    nob:    { side:"e", name:"Grukk nob",     tag:"N", M:3, WS:3, BS:5, T:5, W:3, Sv:4, ranged:"slugga",  melee:"klaw" },
    boss:   { side:"e", name:"Big Boss Skarg",tag:"X", M:3, WS:2, BS:5, T:6, W:6, Sv:3, ranged:"slugga",  melee:"bigklaw" }
  };

  var MISSIONS = [
    { name:"Landfall",        type:"purge", foes:{ boy:7, shoot:2 },                    brief:"Grukk raiders hold the landing zone. Clear them out." },
    { name:"The Relay",       type:"hold",  foes:{ boy:7, shoot:3 },                    brief:"Two vox relays must stay in our hands. Hold them at the end of each round from the second." },
    { name:"Burning Streets", type:"purge", foes:{ boy:8, shoot:3, nob:1 },             brief:"A nob leads this mob. Cut it down and the rest will scatter." },
    { name:"Rokkit Ridge",    type:"hold",  foes:{ boy:6, shoot:2, rokkit:1, nob:1 },   brief:"A rokkit covers the ridge. Take the relays and keep your heads down." },
    { name:"The Foundry",     type:"purge", foes:{ boy:7, shoot:2, rokkit:1, nob:1 },   brief:"The foundry turns out their guns. Burn the crews." },
    { name:"Skarg's Fall",    type:"purge", foes:{ boy:6, shoot:2, rokkit:1, boss:1 }, brief:"Big Boss Skarg himself. Kill him and the warband breaks." }
  ];

  var NAMES = ["Varn","Castor","Ivo","Darrus","Hale","Orsan","Tarik","Benedek","Lucan","Mattias","Ser","Aldric","Corvin","Kade","Remus","Talon","Voss","Adrel"];

  /* ---------------------------------------------------------------------
     DICE
     --------------------------------------------------------------------- */
  function mulberry(a){
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = Math.random;
  function d6(){ return 1 + Math.floor(rng() * 6); }
  function woundOn(S, T){
    if(S >= 2 * T) return 2;
    if(S > T) return 3;
    if(S === T) return 4;
    if(S * 2 <= T) return 6;
    return 5;
  }

  /* ---------------------------------------------------------------------
     THE BOARD
     --------------------------------------------------------------------- */
  function idx(x, y){ return y * COLS + x; }
  function inside(x, y){ return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

  /* Ruins block movement and sight; crates block movement but not sight,
     and give cover to whoever is behind them. Placed in clusters, mirrored
     roughly so neither end is all open ground, and checked so the two
     deployment zones are always joined. */
  function makeMap(seedRng){
    for(var tries = 0; tries < 50; tries++){
      var t = [];
      for(var i = 0; i < COLS * ROWS; i++) t.push(0);
      var n = 6 + Math.floor(seedRng() * 3);
      for(var k = 0; k < n; k++){
        var x = Math.floor(seedRng() * COLS), y = 3 + Math.floor(seedRng() * (ROWS - 6));
        var len = 1 + Math.floor(seedRng() * 3), horiz = seedRng() < 0.5;
        for(var j = 0; j < len; j++){
          var xx = x + (horiz ? j : 0), yy = y + (horiz ? 0 : j);
          if(inside(xx, yy) && yy > 2 && yy < ROWS - 3) t[idx(xx, yy)] = 1;
        }
      }
      for(k = 0; k < 9; k++){
        x = Math.floor(seedRng() * COLS); y = 2 + Math.floor(seedRng() * (ROWS - 4));
        if(!t[idx(x, y)]) t[idx(x, y)] = 2;
      }
      if(joined(t)) return t;
    }
    return t;
  }
  function joined(t){
    var seen = {}, q = [];
    for(var x = 0; x < COLS; x++) if(!t[idx(x, ROWS - 1)]){ seen[idx(x, ROWS - 1)] = 1; q.push([x, ROWS - 1]); }
    while(q.length){
      var p = q.shift();
      if(p[1] === 0) return true;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nx = p[0] + d[0], ny = p[1] + d[1];
        if(inside(nx, ny) && !t[idx(nx, ny)] && !seen[idx(nx, ny)]){ seen[idx(nx, ny)] = 1; q.push([nx, ny]); }
      });
    }
    return false;
  }

  function unitAt(b, x, y){
    for(var i = 0; i < b.units.length; i++){
      var u = b.units[i];
      if(u.w > 0 && u.x === x && u.y === y) return u;
    }
    return null;
  }
  function alive(b, side){ return b.units.filter(function(u){ return u.w > 0 && u.side === side; }); }
  function dist(a, b){ return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
  function adjacent(a, b){ return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)) === 1; }
  function engaged(b, u){
    return b.units.some(function(o){ return o.w > 0 && o.side !== u.side && adjacent(o, u); });
  }

  /* Steps from a tile, eight ways, through open ground only. A diagonal
     cannot squeeze between two blocked tiles. */
  function reach(b, u, maxSteps){
    var out = {}, q = [[u.x, u.y, 0]];
    out[idx(u.x, u.y)] = { d:0, from:null };
    while(q.length){
      var p = q.shift();
      if(p[2] >= maxSteps) continue;
      for(var dx = -1; dx <= 1; dx++) for(var dy = -1; dy <= 1; dy++){
        if(!dx && !dy) continue;
        var nx = p[0] + dx, ny = p[1] + dy;
        if(!inside(nx, ny) || b.tiles[idx(nx, ny)] || out[idx(nx, ny)]) continue;
        if(dx && dy && b.tiles[idx(p[0] + dx, p[1])] && b.tiles[idx(p[0], p[1] + dy)]) continue;
        if(unitAt(b, nx, ny)) continue;
        out[idx(nx, ny)] = { d:p[2] + 1, from:idx(p[0], p[1]) };
        q.push([nx, ny, p[2] + 1]);
      }
    }
    return out;
  }
  function pathTo(r, x, y){
    var path = [], k = idx(x, y);
    while(k !== null && r[k]){ path.unshift({ x:k % COLS, y:Math.floor(k / COLS) }); k = r[k].from; }
    return path;
  }

  /* The tiles a line passes through between two models, centre to centre,
     endpoints excluded. Supercover, so a line that clips a ruin's corner
     is blocked by it. */
  function lineTiles(a, b){
    var out = [], steps = Math.ceil(Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y)) * 4);
    var seen = {};
    for(var i = 1; i < steps; i++){
      var t = i / steps;
      var x = Math.round(a.x + (b.x - a.x) * t), y = Math.round(a.y + (b.y - a.y) * t);
      var k = idx(x, y);
      if((x === a.x && y === a.y) || (x === b.x && y === b.y) || seen[k]) continue;
      seen[k] = 1;
      out.push({ x:x, y:y, k:k });
    }
    return out;
  }
  function canSee(b, a, t){
    return !lineTiles(a, t).some(function(p){ return b.tiles[p.k] === 1; });
  }
  // a crate in the last two tiles before the target puts it in cover
  function inCover(b, a, t){
    return lineTiles(a, t).some(function(p){
      return b.tiles[p.k] === 2 && Math.max(Math.abs(p.x - t.x), Math.abs(p.y - t.y)) <= 2;
    });
  }

  function stat(u, k){ return u[k] !== undefined ? u[k] : KINDS[u.kind][k]; }
  function weapon(u, kind){ return WEAPONS[KINDS[u.kind][kind]]; }
  function canShoot(b, u, t){
    var w = weapon(u, "ranged");
    if(!w || t.w <= 0 || t.side === u.side) return false;
    if(engaged(b, u) && !(w.pistol && adjacent(u, t))) return false;
    return dist(u, t) <= w.range + 0.01 && canSee(b, u, t);
  }

  /* One attack, all the way through: hit, wound, save, damage. Returns the
     dice so the screen can show them. */
  function attack(b, att, def, w, opts){
    opts = opts || {};
    var melee = !!w.melee;
    var A = w.A + (opts.charge ? 1 : 0) + (w.rapid && dist(att, def) <= w.range / 2 ? 1 : 0) + (melee ? (att.bonusA || 0) : 0);
    var hitNeed = melee ? stat(att, "WS") : stat(att, "BS");
    if(w.heavy && opts.moved) hitNeed++;
    if(w.clumsy) hitNeed++;
    if(opts.overwatch) hitNeed++;
    hitNeed = Math.max(2, Math.min(6, hitNeed));
    var woundNeed = woundOn(w.S, stat(def, "T"));
    var sv = stat(def, "Sv") - w.AP;
    var cover = !melee && inCover(b, att, def) && !(stat(def, "Sv") <= 3 && w.AP === 0);
    if(cover) sv--;
    sv = Math.max(2, sv);
    var hits = [], wounds = [], saves = [], dmg = 0;
    for(var i = 0; i < A; i++) hits.push(d6());
    var nHit = hits.filter(function(r){ return r >= hitNeed; }).length;
    for(i = 0; i < nHit; i++) wounds.push(d6());
    var nWound = wounds.filter(function(r){ return r >= woundNeed; }).length;
    for(i = 0; i < nWound; i++) saves.push(d6());
    var failed = sv > 6 ? nWound : saves.filter(function(r){ return r < sv; }).length;
    var before = def.w;
    for(i = 0; i < failed && def.w > 0; i++){ def.w = Math.max(0, def.w - w.D); }
    dmg = before - def.w;
    if(!opts.sim && dmg) def.taken = (def.taken || 0) + dmg;
    if(def.w <= 0){
      def.w = 0;
      if(att.side === "p" && !opts.sim){
        att.kills = (att.kills || 0) + 1;
        (att.slew = att.slew || []).push(def.kind);
      }
      if(def.side === "p" && !opts.sim) def.fellTo = KINDS[att.kind].name + "'s " + w.name.toLowerCase();
    }
    return { att:att, def:def, w:w, before:before, hits:hits, hitNeed:hitNeed, wounds:wounds, woundNeed:woundNeed,
             saves:saves, sv:sv > 6 ? null : sv, cover:cover, dmg:dmg, slain:def.w <= 0 };
  }

  /* Melee is both ways: whoever charged strikes first, then the survivor
     strikes back. */
  function fight(b, att, def, charge){
    var out = [attack(b, att, def, weapon(att, "melee"), { charge:charge })];
    if(def.w > 0) out.push(attack(b, def, att, weapon(def, "melee"), {}));
    return out;
  }

  /* ---------------------------------------------------------------------
     A BATTLE
     --------------------------------------------------------------------- */
  function newBattle(roster, mi, seed){
    var r = mulberry(seed);
    var m = MISSIONS[mi];
    var b = { mi:mi, type:m.type, round:1, tiles:makeMap(r), units:[], vp:0, log:[], over:null, turn:"p", ow:{} };
    var spots = [];
    for(var x = 0; x < COLS; x++) for(var y = ROWS - 2; y < ROWS; y++) if(!b.tiles[idx(x, y)]) spots.push([x, y]);
    var fit = roster.filter(function(s){ return !s.dead; });
    fit.forEach(function(s, i){
      var p = spots.splice(Math.floor(r() * spots.length), 1)[0];
      b.units.push({ id:"p" + i, sid:s.id, side:"p", kind:s.kind, name:s.name, x:p[0], y:p[1],
                     w:KINDS[s.kind].W + (s.bonusW || 0), maxW:KINDS[s.kind].W + (s.bonusW || 0),
                     BS:KINDS[s.kind].BS - (s.bonusBS || 0), bonusA:s.bonusA || 0, done:false, kills:0, look:s.look, rank:s.rank });
    });
    spots = [];
    for(x = 0; x < COLS; x++) for(y = 0; y < 3; y++) if(!b.tiles[idx(x, y)]) spots.push([x, y]);
    var n = 0;
    Object.keys(m.foes).forEach(function(k){
      for(var i = 0; i < m.foes[k]; i++){
        var p = spots.splice(Math.floor(r() * spots.length), 1)[0];
        b.units.push({ id:"e" + (n++), side:"e", kind:k, name:KINDS[k].name, x:p[0], y:p[1], w:KINDS[k].W, maxW:KINDS[k].W, done:false });
      }
    });
    if(m.type === "hold"){
      b.objs = [{ x:2, y:6 }, { x:7, y:8 }];
      b.objs.forEach(function(o){ b.tiles[idx(o.x, o.y)] = 0; });
    }
    return b;
  }

  function controls(b, o){
    var mine = 0, theirs = 0;
    b.units.forEach(function(u){
      if(u.w <= 0 || Math.max(Math.abs(u.x - o.x), Math.abs(u.y - o.y)) > 1) return;
      if(u.side === "p") mine++; else theirs += u.kind === "nob" || u.kind === "boss" ? 2 : 1;
    });
    return mine > theirs ? "p" : theirs > mine ? "e" : null;
  }

  function checkEnd(b){
    if(b.over) return b.over;
    if(!alive(b, "p").length) b.over = "lost";
    else if(!alive(b, "e").length) b.over = "won";
    return b.over;
  }

  /* The round turns over when every model on both sides has gone. Relays
     score as it does. */
  function endRound(b, log){
    if(b.type === "hold" && b.round >= 2){
      b.objs.forEach(function(o){ if(controls(b, o) === "p"){ b.vp++; } });
      log("Round " + b.round + ": you hold " + b.objs.filter(function(o){ return controls(b, o) === "p"; }).length + " relay(s). " + b.vp + " VP.");
    }
    if(b.round >= ROUNDS){
      var target = purgeTarget(b);
      if(b.type === "hold") b.over = b.vp >= 4 ? "won" : "lost";
      else b.over = kills(b) >= target && !bossAlive(b) ? "won" : "lost";
      return;
    }
    b.round++;
    b.ow = {};
    b.units.forEach(function(u){ u.done = false; u.moved = false; });
    b.turn = "p";
  }
  function kills(b){ return b.units.filter(function(u){ return u.side === "e" && u.w <= 0; }).length; }
  function purgeTarget(b){
    return Math.ceil(b.units.filter(function(u){ return u.side === "e"; }).length * 0.75);
  }
  function bossAlive(b){ return b.units.some(function(u){ return u.kind === "boss" && u.w > 0; }); }

  /* After either side finishes an activation, whose go is it? Turns
     alternate while both have models left to activate. */
  function passTurn(b){
    var pLeft = alive(b, "p").some(function(u){ return !u.done; });
    var eLeft = alive(b, "e").some(function(u){ return !u.done; });
    if(!pLeft && !eLeft) return "round";
    if(b.turn === "p") b.turn = eLeft ? "e" : "p";
    else b.turn = pLeft ? "p" : "e";
    return b.turn;
  }

  /* Overwatch: a model that held its fire shoots the first enemy to end a
     move in its sights, at -1 to hit. Once per round. */
  function overwatch(b, mover, log){
    var out = [];
    alive(b, mover.side === "p" ? "e" : "p").forEach(function(u){
      if(!b.ow[u.id] || mover.w <= 0 || !canShoot(b, u, mover)) return;
      delete b.ow[u.id];
      out.push(attack(b, u, mover, weapon(u, "ranged"), { overwatch:true }));
    });
    return out;
  }

  /* ---------------------------------------------------------------------
     THE GRUKK

     Simple and loud: hit whatever is next to you, charge whatever you can
     reach, otherwise close in and shoot. Rokkits hang back. In a hold
     mission they also want the relays.
     --------------------------------------------------------------------- */
  function foeOrder(b){
    var ps = alive(b, "p");
    return alive(b, "e").filter(function(u){ return !u.done; }).sort(function(a, c){
      return nearest(ps, a).d - nearest(ps, c).d;
    });
  }
  function nearest(list, u){
    var best = null, bd = Infinity;
    list.forEach(function(o){ var d = dist(o, u); if(d < bd){ bd = d; best = o; } });
    return { u:best, d:bd };
  }
  function enemyPlan(b, u){
    var ps = alive(b, "p");
    var adj = ps.filter(function(p){ return adjacent(p, u); });
    if(adj.length) return { act:"fight", target:adj.sort(function(a, c){ return a.w - c.w; })[0] };
    var r = reach(b, u, KINDS[u.kind].M + 2);
    if(u.kind !== "rokkit" && u.kind !== "shoot"){
      var best = null;
      ps.forEach(function(p){
        for(var dx = -1; dx <= 1; dx++) for(var dy = -1; dy <= 1; dy++){
          var x = p.x + dx, y = p.y + dy, k = inside(x, y) ? idx(x, y) : -1;
          if(k >= 0 && r[k] && (!best || r[k].d < best.d || (r[k].d === best.d && p.w < best.t.w))) best = { d:r[k].d, x:x, y:y, t:p };
        }
      });
      if(best) return { act:"charge", x:best.x, y:best.y, target:best.t };
    }
    // where to stand: a relay if it needs taking, else as near the nearest
    // marine as a move allows - or, for guns, anywhere that has a shot
    var rm = reach(b, u, KINDS[u.kind].M), goal = nearest(ps, u).u;
    if(b.type === "hold"){
      var o = b.objs.filter(function(o){ return controls(b, o) !== "e"; }).sort(function(a, c){ return dist(a, u) - dist(c, u); })[0];
      if(o && dist(o, u) > 1.5 && u.kind !== "rokkit") goal = o;
    }
    var pick = { x:u.x, y:u.y }, pd = Infinity;
    var w = weapon(u, "ranged");
    var sniping = u.kind === "rokkit" || u.kind === "shoot";
    Object.keys(rm).forEach(function(k){
      k = +k;
      var spot = { x:k % COLS, y:Math.floor(k / COLS) };
      var score = dist(spot, goal);
      if(sniping){
        var shot = ps.some(function(p){ return dist(spot, p) <= w.range && canSee(b, spot, p); });
        if(shot) score -= u.kind === "rokkit" ? 100 + rm[k].d * 0.1 : 6;
      }
      if(score < pd){ pd = score; pick = spot; }
    });
    return { act:"move", x:pick.x, y:pick.y };
  }

  /* ---------------------------------------------------------------------
     THE CAMPAIGN
     --------------------------------------------------------------------- */
  /* Who they are. Nothing here changes a dice roll - it is so that the
     brother who dies on the relay was someone: where he came from, how he
     carries himself, what he has done. */
  var HOMEWORLDS = ["the hive-world Calvex","the ash wastes of Morrow","feral Tharsis","the shrine-moon Ilos",
                    "orbital hab Kessel-9","the ice world Haldane","the forge-world Vey","the ocean world Pelagia",
                    "the death world Ruun","the frontier colony Gaunt's Reach"];
  var TRAITS = [
    { n:"Stoic",        d:"Says little. Misses less.",                          q:"Words are ammunition. Spend them carefully." },
    { n:"Zealous",      d:"First into the breach, every time.",                q:"Every one I kill is a prayer answered." },
    { n:"Grim humour",  d:"Jokes in the worst moments. Keeps the squad sane.", q:"Cheer up, brother. They can only kill us once." },
    { n:"Methodical",   d:"Counts every round and checks every angle.",        q:"Patience. The gap always comes." },
    { n:"Hot-blooded",  d:"Hates the greenskins with a personal passion.",     q:"Let them come. All of them." },
    { n:"Devout",       d:"Recites the litanies under fire.",                  q:"My armour is my faith, and it has never failed." },
    { n:"Old soldier",  d:"Has outlived three squads. Does not talk about it.", q:"I have seen worse. Not much worse." },
    { n:"Proud",        d:"Keeps his armour immaculate, even in the mud.",     q:"We are watched. Fight like it." },
    { n:"Vengeful",     d:"Lost his first squad to the Grukk. Keeps count.",   q:"That is forty-one. I will tell you when I am done." },
    { n:"Steady",       d:"The one the others look to when it goes wrong.",    q:"Breathe. Aim. Again." }
  ];
  var STRIPES = ["#C9B26B","#B8432F","#E6EBEF","#4FA88B","#7A9CC6","#D08A3A","#9C6FC1","#2A2F36"];
  var LENSES = ["#5CE07A","#E0574A","#6FC7FF","#FFD45C"];
  var RANK_NAMES = ["", "Veteran", "Honoured", "Paragon"];

  function makeSoldier(kind, id, taken){
    var free = NAMES.filter(function(n){ return taken.indexOf(n) < 0; });
    var name = free[Math.floor(rng() * free.length)] || NAMES[id % NAMES.length];
    var s = { id:id, kind:kind, short:name, name:(kind === "sgt" ? "Sergeant " : "Brother ") + name,
              xp:0, rank:0, missions:0, kills:0, slew:{}, falls:0, deeds:[] };
    // a fresh soldier is rolled fresh; persona() below only fills gaps in old saves
    s.home = HOMEWORLDS[Math.floor(rng() * HOMEWORLDS.length)];
    s.trait = Math.floor(rng() * TRAITS.length);
    s.look = { stripe:STRIPES[Math.floor(rng() * STRIPES.length)], lens:LENSES[Math.floor(rng() * LENSES.length)],
               scar:rng() < 0.35, age:Math.floor(60 + rng() * 140) };
    persona(s);
    return s;
  }
  // also fills in soldiers from saves made before they had one
  function persona(s){
    var r = mulberry(s.id * 7919 + 13);
    if(!s.short) s.short = s.name.replace(/^(Sergeant|Brother) /, "");
    if(!s.home) s.home = HOMEWORLDS[Math.floor(r() * HOMEWORLDS.length)];
    if(s.trait === undefined) s.trait = Math.floor(r() * TRAITS.length);
    if(!s.look) s.look = { stripe:STRIPES[Math.floor(r() * STRIPES.length)], lens:LENSES[Math.floor(r() * LENSES.length)],
                           scar:r() < 0.35, age:Math.floor(60 + r() * 140) };
    s.kills = s.kills || 0; s.slew = s.slew || {}; s.falls = s.falls || 0; s.deeds = s.deeds || [];
    return s;
  }
  function newCampaign(){
    var kinds = ["sgt","bro","bro","gunner","sniper"], taken = [];
    var roster = kinds.map(function(k, i){ var s = makeSoldier(k, i, taken); taken.push(s.short); return s; });
    return { mi:0, battle:null, nextId:5, roster:roster, fallen:[], done:false, pace:"normal", step:false };
  }
  function takenNames(c){ return c.roster.concat(c.fallen || []).map(function(s){ return s.short; }); }
  var RANKS = [0, 3, 7, 12];
  function deed(s, text){ s.deeds.unshift(text); if(s.deeds.length > 10) s.deeds.length = 10; }

  /* Survivors earn experience: a point for living through it, one for each
     kill. Each rank gives a little more - a wound, a steadier aim, a
     harder blow. A brother who fell rolls a die: on a 1 he is gone, and a
     new one takes his place. Returns the report the debrief screen shows,
     one row per brother who took the field. */
  function debrief(c, b){
    var m = MISSIONS[b.mi], rows = [], lines = [];
    var best = 0;
    b.units.forEach(function(u){ if(u.side === "p") best = Math.max(best, u.kills || 0); });
    c.fallen = c.fallen || [];
    c.roster.forEach(function(s){
      persona(s);
      var u = b.units.filter(function(x){ return x.sid === s.id; })[0];
      if(!u) return;
      var row = { id:s.id, kills:u.kills || 0, xp:0, status:"", promo:"" };
      var xp = (u.w > 0 ? 1 : 0) + (u.kills || 0) + (b.over === "won" ? 1 : 0);
      row.xp = xp;
      s.xp += xp; s.missions++; s.kills += u.kills || 0;
      (u.slew || []).forEach(function(k){ s.slew[k] = (s.slew[k] || 0) + 1; });
      if((u.slew || []).indexOf("boss") >= 0) deed(s, "Slew Big Boss Skarg at " + m.name + ".");
      else if((u.slew || []).indexOf("nob") >= 0) deed(s, "Cut down a Grukk nob at " + m.name + ".");
      if((u.kills || 0) >= 3) deed(s, (u.kills) + " kills at " + m.name + ".");
      if(best > 0 && (u.kills || 0) === best){ s.mvp = (s.mvp || 0) + 1; row.best = true; }
      var rank = RANKS.filter(function(r){ return s.xp >= r; }).length - 1;
      while(s.rank < rank){
        s.rank++;
        var what = s.rank === 1 ? "+1 wound" : s.rank === 2 ? "a steadier aim" : "+1 attack in combat";
        if(s.rank === 1) s.bonusW = (s.bonusW || 0) + 1;
        if(s.rank === 2) s.bonusBS = (s.bonusBS || 0) + 1;
        if(s.rank === 3) s.bonusA = (s.bonusA || 0) + 1;
        row.promo = RANK_NAMES[s.rank] + ": " + what;
        deed(s, "Raised to " + RANK_NAMES[s.rank] + " after " + m.name + ".");
      }
      if(u.w <= 0){
        s.falls++;
        var roll = d6();
        if(roll === 1){
          s.dead = true;
          s.diedAt = m.name; s.diedTo = u.fellTo || "the Grukk";
          row.status = "Killed in action (rolled a 1)";
          deed(s, "Fell at " + m.name + " to " + s.diedTo + ". Did not rise.");
        } else {
          row.status = "Fell - the apothecary saved him (rolled a " + roll + ")";
          deed(s, "Fell at " + m.name + " to " + (u.fellTo || "the Grukk") + "; brought back by the apothecary.");
        }
      } else row.status = u.taken ? "Wounded, still standing" : "Unhurt";
      rows.push(row);
    });
    // after the second victory, a sixth brother is sent to the squad
    if(b.over === "won" && c.mi === 1 && c.roster.length < 6){
      var nb = makeSoldier("bro", c.nextId++, takenNames(c));
      deed(nb, "Sent to reinforce the squad after " + m.name + ".");
      c.roster.push(nb);
      lines.push(nb.name + " is sent to reinforce the squad.");
    }
    c.roster.forEach(function(s, i){
      if(!s.dead) return;
      c.fallen.push(s);
      var nn = makeSoldier(s.kind, c.nextId++, takenNames(c));
      deed(nn, "Joined the squad to replace " + s.name + ".");
      lines.push(nn.name + " joins the squad in " + s.short + "'s place.");
      c.roster[i] = nn;
    });
    return { mission:m.name, result:b.over, rows:rows, lines:lines };
  }

  /* =====================================================================
     Everything above is the war. Everything below is the screen.
     ===================================================================== */
  function el(id){ return document.getElementById(id); }
  function h(tag, attrs, html){
    var d = document.createElement(tag);
    for(var k in attrs || {}) d.setAttribute(k, attrs[k]);
    if(html !== undefined) d.innerHTML = html;
    return d;
  }

  var KEY = "arcade.oath.v1";
  var camp = null, b = null, sel = null, aim = null, busy = false, lastAtk = [], note = "";
  var acting = null, waitingStep = false, dispW = {}, flash = null, view = null;
  var canvas = null, ctx = null, T = 34;

  function save(){ try{ camp.battle = b; localStorage.setItem(KEY, JSON.stringify(camp)); }catch(e){} }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }

  /* How long things take. Normal is already deliberate; Slow is for
     savouring it. Every pause in a battle goes through here. */
  function P(ms){ return ms * (camp && camp.pace === "slow" ? 1.6 : 1); }
  function wait(ms, fn){ setTimeout(fn, P(ms)); }

  /* ---------------------------------------------------------------------
     ART

     Drawn, not loaded: a helmet for every brother, built from his own
     colours - a stripe, a lens colour, the odd scar - with what marks out
     his job: a sergeant's crest and laurels, a gunner's targeting lens, a
     marksman's hood and scope. The same drawing serves the board token and
     the portrait on his card.
     --------------------------------------------------------------------- */
  var ARMOUR = "#2E4A73", ARMOUR_DK = "#22385A", TRIM = "#C9B26B";
  function helmet(c, x, y, r, kind, look, dead){
    look = look || { stripe:TRIM, lens:"#5CE07A" };
    c.save();
    c.translate(x, y);
    if(kind === "sniper"){
      // the hood, behind and over the helmet
      c.fillStyle = "#33452F";
      c.beginPath(); c.moveTo(-r * 1.05, r * 0.9); c.quadraticCurveTo(-r * 1.15, -r * 1.25, 0, -r * 1.2);
      c.quadraticCurveTo(r * 1.15, -r * 1.25, r * 1.05, r * 0.9); c.closePath(); c.fill();
    }
    if(kind === "sgt"){
      // crest: a red plume over the top
      c.strokeStyle = "#B8432F"; c.lineWidth = r * 0.12; c.lineCap = "round";
      for(var i = -3; i <= 3; i++){
        c.beginPath(); c.moveTo(i * r * 0.08, -r * 0.8); c.lineTo(i * r * 0.17, -r * 1.22 + Math.abs(i) * r * 0.06); c.stroke();
      }
    }
    // the dome
    c.fillStyle = ARMOUR;
    c.beginPath();
    c.moveTo(-r * 0.78, r * 0.35);
    c.bezierCurveTo(-r * 0.9, -r * 0.6, -r * 0.5, -r * 0.95, 0, -r * 0.95);
    c.bezierCurveTo(r * 0.5, -r * 0.95, r * 0.9, -r * 0.6, r * 0.78, r * 0.35);
    c.lineTo(r * 0.5, r * 0.8); c.lineTo(-r * 0.5, r * 0.8); c.closePath(); c.fill();
    // personal stripe down the middle
    c.fillStyle = look.stripe;
    c.fillRect(-r * 0.09, -r * 0.94, r * 0.18, r * 0.62);
    // faceplate and the grille
    c.fillStyle = ARMOUR_DK;
    c.beginPath(); c.moveTo(-r * 0.36, r * 0.12); c.lineTo(r * 0.36, r * 0.12); c.lineTo(r * 0.22, r * 0.78); c.lineTo(-r * 0.22, r * 0.78); c.closePath(); c.fill();
    c.strokeStyle = "#11192A"; c.lineWidth = Math.max(1, r * 0.06);
    for(var g = 0; g < 3; g++){ c.beginPath(); c.moveTo(-r * 0.14, r * (0.36 + g * 0.13)); c.lineTo(r * 0.14, r * (0.36 + g * 0.13)); c.stroke(); }
    // eyes
    c.fillStyle = dead ? "#3A424A" : look.lens;
    c.shadowColor = dead ? "transparent" : look.lens; c.shadowBlur = r * 0.35;
    c.beginPath(); c.ellipse(-r * 0.33, -r * 0.12, r * 0.2, r * 0.12, 0.28, 0, Math.PI * 2); c.fill();
    if(kind === "gunner"){
      c.fillStyle = dead ? "#3A424A" : "#E0574A";
      c.beginPath(); c.arc(r * 0.33, -r * 0.12, r * 0.2, 0, Math.PI * 2); c.fill();
    } else {
      c.beginPath(); c.ellipse(r * 0.33, -r * 0.12, r * 0.2, r * 0.12, -0.28, 0, Math.PI * 2); c.fill();
    }
    c.shadowBlur = 0;
    if(kind === "gunner"){ c.strokeStyle = "#9AA7B2"; c.lineWidth = Math.max(1, r * 0.07); c.beginPath(); c.arc(r * 0.33, -r * 0.12, r * 0.27, 0, Math.PI * 2); c.stroke(); }
    if(kind === "sniper"){
      c.strokeStyle = "#9AA7B2"; c.lineWidth = Math.max(1, r * 0.07);
      c.beginPath(); c.arc(-r * 0.33, -r * 0.12, r * 0.25, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(-r * 0.58, -r * 0.12); c.lineTo(-r * 0.85, -r * 0.2); c.stroke();
    }
    if(kind === "sgt"){
      // laurels on the brow
      c.strokeStyle = TRIM; c.lineWidth = Math.max(1, r * 0.08);
      c.beginPath(); c.arc(0, -r * 0.1, r * 0.62, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
    }
    if(look.scar){
      c.strokeStyle = "rgba(200,205,210,.75)"; c.lineWidth = Math.max(1, r * 0.05);
      c.beginPath(); c.moveTo(r * 0.15, -r * 0.75); c.lineTo(r * 0.55, -r * 0.35); c.stroke();
    }
    if(dead){ c.fillStyle = "rgba(21,28,36,.45)"; c.beginPath(); c.arc(0, 0, r * 1.3, 0, Math.PI * 2); c.fill(); }
    c.restore();
  }

  // a full portrait: helmet, shoulders, squad number and rank chevrons
  function portrait(cv, px, s, dead){
    var k = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cv.height = px * k;
    cv.style.width = cv.style.height = px + "px";
    var c = cv.getContext("2d");
    c.scale(k, k);
    var g = c.createRadialGradient(px / 2, px * 0.4, 0, px / 2, px * 0.4, px * 0.7);
    g.addColorStop(0, "#26313C"); g.addColorStop(1, "#141B22");
    c.fillStyle = g; c.fillRect(0, 0, px, px);
    // shoulders
    [-1, 1].forEach(function(side){
      c.fillStyle = ARMOUR;
      c.beginPath(); c.ellipse(px / 2 + side * px * 0.33, px * 0.93, px * 0.24, px * 0.2, 0, Math.PI, Math.PI * 2); c.fill();
      c.strokeStyle = TRIM; c.lineWidth = px * 0.025; c.stroke();
    });
    c.fillStyle = ARMOUR_DK; c.fillRect(px * 0.36, px * 0.72, px * 0.28, px * 0.28);
    // squad number on the left pauldron, rank chevrons on the right
    c.fillStyle = s.look.stripe; c.font = "700 " + Math.round(px * 0.11) + "px -apple-system,system-ui,sans-serif"; c.textAlign = "center";
    c.fillText(String(s.id + 1), px * 0.18, px * 0.92);
    c.strokeStyle = TRIM; c.lineWidth = px * 0.022;
    for(var i = 0; i < s.rank; i++){
      var yy = px * (0.86 - i * 0.045);
      c.beginPath(); c.moveTo(px * 0.76, yy - px * 0.02); c.lineTo(px * 0.82, yy + px * 0.015); c.lineTo(px * 0.88, yy - px * 0.02); c.stroke();
    }
    helmet(c, px / 2, px * 0.47, px * (s.kind === "gunner" ? 0.31 : 0.29), s.kind, s.look, dead);
  }

  // the horde, drawn smaller and meaner
  function grukk(c, x, y, r, kind){
    c.save(); c.translate(x, y);
    var skin = kind === "boss" ? "#5E8F2C" : "#5A8A2A";
    if(kind === "rokkit"){ c.fillStyle = "#6B6F75"; c.save(); c.rotate(-0.6); c.fillRect(-r * 0.2, -r * 1.25, r * 0.4, r * 1.3); c.fillStyle = "#B8432F"; c.fillRect(-r * 0.2, -r * 1.35, r * 0.4, r * 0.18); c.restore(); }
    c.fillStyle = skin;
    c.beginPath(); c.ellipse(0, r * 0.05, r * 0.82, r * 0.78, 0, 0, Math.PI * 2); c.fill();
    if(kind === "nob" || kind === "boss"){
      c.fillStyle = "#6B6F75";
      c.beginPath(); c.ellipse(0, -r * 0.35, r * 0.8, r * 0.45, 0, Math.PI, Math.PI * 2); c.fill();
      c.fillStyle = kind === "boss" ? "#D9D2C0" : "#BFB8A6";
      [-1, 1].forEach(function(sd){
        c.beginPath(); c.moveTo(sd * r * 0.6, -r * 0.5); c.quadraticCurveTo(sd * r * 1.2, -r * 0.7, sd * r * (kind === "boss" ? 1.25 : 1.05), -r * (kind === "boss" ? 1.35 : 1.05));
        c.lineTo(sd * r * 0.45, -r * 0.62); c.closePath(); c.fill();
      });
    }
    // brow, eyes, tusks
    c.fillStyle = "#3F6620"; c.fillRect(-r * 0.6, -r * 0.25, r * 1.2, r * 0.2);
    c.fillStyle = "#FF5A3C";
    c.beginPath(); c.arc(-r * 0.3, -r * 0.02, r * 0.12, 0, Math.PI * 2); c.arc(r * 0.3, -r * 0.02, r * 0.12, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#EDE6D3";
    c.beginPath(); c.moveTo(-r * 0.38, r * 0.45); c.lineTo(-r * 0.28, r * 0.12); c.lineTo(-r * 0.18, r * 0.45); c.fill();
    c.beginPath(); c.moveTo(r * 0.38, r * 0.45); c.lineTo(r * 0.28, r * 0.12); c.lineTo(r * 0.18, r * 0.45); c.fill();
    if(kind === "shoot"){ c.fillStyle = "#4A535C"; c.fillRect(r * 0.45, r * 0.25, r * 0.75, r * 0.22); }
    c.restore();
  }

  /* ---------------------------------------------------------------------
     THE BOARD
     --------------------------------------------------------------------- */
  function size(){
    var box = el("app").getBoundingClientRect();
    var avail = Math.min(box.width, (window.innerHeight - 300) * COLS / ROWS);
    T = Math.max(24, Math.floor(avail / COLS));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = COLS * T * dpr; canvas.height = ROWS * T * dpr;
    canvas.style.width = COLS * T + "px"; canvas.style.height = ROWS * T + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function cx(x){ return x * T + T / 2; }
  function shownW(u){ return dispW[u.id] !== undefined ? dispW[u.id] : u.w; }

  function draw(){
    if(!ctx || !b) return;
    ctx.fillStyle = "#10161C"; ctx.fillRect(0, 0, COLS * T, ROWS * T);
    for(var y = 0; y < ROWS; y++) for(var x = 0; x < COLS; x++){
      var t = b.tiles[idx(x, y)];
      ctx.fillStyle = (x + y) % 2 ? "#151D24" : "#131A21";
      if(y >= ROWS - 2) ctx.fillStyle = (x + y) % 2 ? "#172229" : "#152027";
      ctx.fillRect(x * T, y * T, T, T);
      if(t === 1){
        ctx.fillStyle = "#4A535C"; ctx.fillRect(x * T + 1, y * T + 1, T - 2, T - 2);
        ctx.fillStyle = "#3A424A"; ctx.fillRect(x * T + 4, y * T + T * 0.55, T - 8, T * 0.3);
      }
      if(t === 2){
        ctx.fillStyle = "#6B4F32"; ctx.fillRect(x * T + 5, y * T + 5, T - 10, T - 10);
        ctx.strokeStyle = "#8A6A45"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x * T + 5, y * T + 5); ctx.lineTo(x * T + T - 5, y * T + T - 5); ctx.stroke();
      }
    }
    if(b.objs) b.objs.forEach(function(o){
      var c = controls(b, o);
      ctx.strokeStyle = c === "p" ? "#4FA88B" : c === "e" ? "#9BC53D" : "#E0A458";
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x * T - T + 3, o.y * T - T + 3, T * 3 - 6, T * 3 - 6);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.moveTo(cx(o.x), o.y * T + 6); ctx.lineTo(o.x * T + T - 7, cx(o.y)); ctx.lineTo(cx(o.x), o.y * T + T - 6); ctx.lineTo(o.x * T + 7, cx(o.y)); ctx.closePath(); ctx.fill();
    });

    if(sel && sel.w > 0 && !sel.done && b.turn === "p" && !busy){
      if(!sel.moved){
        var r = reach(b, sel, KINDS[sel.kind].M);
        Object.keys(r).forEach(function(k){
          if(!r[k].d) return;
          k = +k;
          ctx.fillStyle = "rgba(79,168,139,.18)";
          ctx.fillRect((k % COLS) * T + 2, Math.floor(k / COLS) * T + 2, T - 4, T - 4);
        });

      ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.45; helmet(ctx, cx(aim.x), cx(aim.y), T * 0.36, sel.kind, sel.look); ctx.globalAlpha = 1;
    }
    if(aim && aim.kind === "target"){
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2.5;
      ctx.strokeRect(aim.t.x * T + 1, aim.t.y * T + 1, T - 2, T - 2);
      ctx.strokeStyle = "rgba(255,227,160,.5)"; ctx.lineWidth = 1.5; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(cx(sel.x), cx(sel.y)); ctx.lineTo(cx(aim.t.x), cx(aim.t.y)); ctx.stroke(); ctx.setLineDash([]);

    }
    if(flash){
      ctx.strokeStyle = flash.melee ? "#E0574A" : "#FFE3A0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx(flash.a.x), cx(flash.a.y)); ctx.lineTo(cx(flash.d.x), cx(flash.d.y)); ctx.stroke();
      if(flash.text){
        ctx.fillStyle = "#E0574A"; ctx.font = "700 15px -apple-system,system-ui,sans-serif"; ctx.textAlign = "center";
        ctx.strokeStyle = "#10161C"; ctx.lineWidth = 3; ctx.strokeText(flash.text, cx(flash.d.x), flash.d.y * T - 2);

  }
  function drawUnit(u){
    var x = cx(u.x), y = cx(u.y), p = u.side === "p", w = shownW(u);
    ctx.globalAlpha = u.done ? 0.55 : 1;
    ctx.fillStyle = p ? "#1C2A3D" : "#26331A";
    ctx.beginPath(); ctx.arc(x, y, T * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = sel === u ? 2.5 : 1.5;
    ctx.strokeStyle = sel === u ? "#FFFFFF" : p ? "#C9B26B" : "#3E5A22";
    ctx.stroke();
    if(p) helmet(ctx, x, y + T * 0.04, T * 0.3, u.kind, u.look);
    else grukk(ctx, x, y + T * 0.04, T * (u.kind === "boss" ? 0.36 : u.kind === "nob" ? 0.33 : 0.29), u.kind);
    if(u.maxW > 1){
      for(var i = 0; i < u.maxW; i++){
        ctx.fillStyle = i < w ? (p ? "#4FA88B" : "#E0A458") : "#2C3945";
        ctx.fillRect(x - u.maxW * 2.5 + i * 5, y + T * 0.45 - 2, 4, 3);
      }
    }
    if(b.ow[u.id]){ ctx.strokeStyle = "#E0A458"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, T * 0.45 + 2, -2.4, -0.7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  function chargeSpot(u, e){
    if(adjacent(u, e)) return null;
    var r = reach(b, u, KINDS[u.kind].M + 2), best = null;
    for(var dx = -1; dx <= 1; dx++) for(var dy = -1; dy <= 1; dy++){
      var x = e.x + dx, y = e.y + dy;
      if(!inside(x, y)) continue;
      var k = idx(x, y);
      if(r[k] && r[k].d > 0 && (!best || r[k].d < best.d)) best = { d:r[k].d, x:x, y:y };
    }
    return best;
  }

  /* ---------------------------------------------------------------------
     DICE, ONE STAGE AT A TIME

     Each attack is revealed in steps - who and with what, then the hit
     dice tumble and settle, then the wound dice, then the saves, then
     what it cost. The result is already decided; the reveal is so you
     can follow it, and feel it.
     --------------------------------------------------------------------- */
  function stagesOf(a){
    var st = ["head", "hit"];
    if(a.wounds.length) st.push("wound");
    if(a.saves.length && a.sv) st.push("save");
    st.push("dmg");
    return st;
  }
  function diceHtml(rolls, need, rolling){
    return '<span class="dice">' + rolls.map(function(r){
      if(rolling) return '<span class="die" data-roll="true">' + (1 + Math.floor(Math.random() * 6)) + "</span>";
      return '<span class="die" data-ok="' + (r >= need) + '">' + r + "</span>";
    }).join("") + "</span>";
  }
  function attackHtml(a){
    var stages = stagesOf(a), shown = a.stage === undefined ? stages.length : a.stage;
    var s = '<div class="line"><b>' + shortName(a.att) + "</b> → " + shortName(a.def) + " · " + a.w.name + (a.cover ? " · in cover" : "") + "</div>";
    for(var i = 1; i < stages.length && i <= shown; i++){
      var stg = stages[i], rolling = a.rolling === stg;
      if(stg === "hit") s += '<div class="step"><b>Hit ' + a.hitNeed + "+</b>" + diceHtml(a.hits, a.hitNeed, rolling) + count(a.hits, a.hitNeed, rolling, "hit") + "</div>";
      if(stg === "wound") s += '<div class="step"><b>Wound ' + a.woundNeed + "+</b>" + diceHtml(a.wounds, a.woundNeed, rolling) + count(a.wounds, a.woundNeed, rolling, "wound") + "</div>";
      if(stg === "save") s += '<div class="step"><b>Save ' + a.sv + "+</b>" + diceHtml(a.saves, a.sv, rolling) + count(a.saves, a.sv, rolling, "saved") + "</div>";
      if(stg === "dmg"){
        var noSave = a.wounds.some(function(r){ return r >= a.woundNeed; }) && !a.sv;
        s += '<div class="step"><b class="out" data-bad="' + (a.dmg > 0) + '">' + (noSave ? "No save. " : "") + (a.slain ? "Slain" : a.dmg ? a.dmg + " damage" : "No damage") + "</b></div>";
      }
    }
    return s;
  }
  function count(rolls, need, rolling, word){
    if(rolling) return "";
    var n = rolls.filter(function(r){ return r >= need; }).length;
    return '<span class="cnt">' + n + " " + word + (word === "hit" || word === "wound" ? (n === 1 ? "" : "s") : "") + "</span>";
  }
  function shortName(u){ return u.side === "p" ? u.name.replace(/^(Sergeant|Brother) /, "") : KINDS[u.kind].name; }

  function walk(u, path, done){
    var i = 1;
    (function step(){
      if(i >= path.length){ done(); return; }
      u.x = path[i].x; u.y = path[i].y; i++;
      draw();
      wait(170, step);
    })();
  }
  function showAttacks(list, done){
    if(!list.length){ done(); return; }
    // the board shows wounds as they are revealed, not as they were rolled
    list.forEach(function(a){ if(dispW[a.def.id] === undefined) dispW[a.def.id] = a.before; });
    lastAtk = list;
    list.forEach(function(a){ a.stage = -1; });
    var i = 0;
    (function nextAttack(){
      if(i >= list.length){ dispW = {}; flash = null; draw(); done(); return; }
      var a = list[i++], stages = stagesOf(a), k = 0;
      a.stage = 0;
      flash = { a:a.att, d:a.def, melee:a.w.melee };
      renderLog(); draw();
      wait(650, function nextStage(){
        k++;
        if(k >= stages.length){ nextAttack(); return; }
        var stg = stages[k];
        a.stage = k;
        if(stg === "dmg"){
          dispW[a.def.id] = a.before - a.dmg;
          flash = { a:a.att, d:a.def, melee:a.w.melee, text:a.slain ? "✕" : a.dmg ? "-" + a.dmg : "" };
          renderLog(); draw();
          wait(a.dmg ? 1000 : 700, nextStage);
          return;
        }
        // the dice tumble, then settle
        a.rolling = stg;
        var t0 = Date.now();
        (function tumble(){
          renderLog();
          if(Date.now() - t0 < P(480)){ setTimeout(tumble, 70); return; }
          a.rolling = null;
          renderLog();
          wait(650, nextStage);
        })();
      });
    })();
  }

  /* What an attack is likely to do, for the button that commits to it:
     the real rules run a few hundred times on copies. */
  function odds(att, def, w, opts){
    var n = 300, kills = 0, dmg = 0, last = null;
    var keep = rng;
    for(var i = 0; i < n; i++){
      var a2 = Object.assign({}, att), d2 = Object.assign({}, def);
      last = attack(b, a2, d2, w, Object.assign({ sim:true }, opts));
      dmg += last.dmg;
      if(last.slain) kills++;
    }
    rng = keep;
    return { kill:Math.round(kills / n * 100), dmg:dmg / n, hitNeed:last.hitNeed, woundNeed:last.woundNeed, sv:last.sv, cover:last.cover,
             A:w.A + (opts.charge ? 1 : 0) + (w.rapid && dist(att, def) <= w.range / 2 ? 1 : 0) + (w.melee ? (att.bonusA || 0) : 0) };
  }

  /* ---------------------------------------------------------------------
     YOUR GO

     Pick a brother, then a place or a foe. Nothing happens until you
     press the button that says what will happen.
     --------------------------------------------------------------------- */
  function tap(x, y){
    if(busy || !b || b.over || b.turn !== "p") return;
    var u = unitAt(b, x, y);
    if(u && u.side === "p"){
      if(sel && sel !== u && sel.moved && !sel.done){ note = "Finish " + shortName(sel) + "'s activation first."; renderBattle(); return; }
      aim = null;
      if(u.done){ note = shortName(u) + " has already gone this round."; sel = u; renderBattle(); return; }
      sel = u; note = ""; renderBattle(); return;
    }
    if(!sel || sel.done) return;
    if(u && u.side === "e"){
      var opts = [];
      if(adjacent(sel, u)) opts.push({ act:"fight" });
      else {
        if(canShoot(b, sel, u)) opts.push({ act:"shoot" });
        var c = !sel.moved && chargeSpot(sel, u);
        if(c) opts.push({ act:"charge", spot:c });
      }
      if(!opts.length){ aim = null; note = "Out of reach."; renderBattle(); return; }
      opts.forEach(function(o){
        var w = weapon(sel, o.act === "shoot" ? "ranged" : "melee");
        var ghost = o.spot ? Object.assign({}, sel, { x:o.spot.x, y:o.spot.y }) : sel;
        o.odds = odds(ghost, u, w, { moved:sel.moved, charge:o.act === "charge" });
        o.w = w;
      });
      aim = { kind:"target", t:u, opts:opts };
      renderBattle(); return;
    }
    if(!sel.moved){
      var r = reach(b, sel, KINDS[sel.kind].M), k = idx(x, y);
      if(r[k] && r[k].d > 0){ aim = { kind:"move", x:x, y:y, path:pathTo(r, x, y) }; note = ""; renderBattle(); }
    }
  }
  function doMove(){
    var path = aim.path, wasEngaged = engaged(b, sel);
    aim = null; busy = true; lastAtk = [];
    renderBattle();
    walk(sel, path, function(){
      sel.moved = true;
      var ow = overwatch(b, sel, function(){});
      showAttacks(ow, function(){
        busy = false;
        if(sel.w <= 0 || wasEngaged){ finishActivation(); return; }
        if(checkEnd(b)){ renderBattle(); return; }
        renderBattle();
      });
    });
  }
  function doAct(o){
    var t = aim.t;
    aim = null; busy = true; lastAtk = [];
    renderBattle();
    if(o.act === "shoot"){ showAttacks([attack(b, sel, t, o.w, { moved:sel.moved })], finishActivation); return; }
    if(o.act === "fight"){ showAttacks(fight(b, sel, t, false), finishActivation); return; }
    var r = reach(b, sel, KINDS[sel.kind].M + 2);
    walk(sel, pathTo(r, o.spot.x, o.spot.y), function(){
      var ow = overwatch(b, sel, function(){});
      showAttacks(ow, function(){
        if(sel.w <= 0){ finishActivation(); return; }
        showAttacks(fight(b, sel, t, true), finishActivation);
      });
    });
  }
  function holdFire(){
    if(!sel || sel.done || busy) return;
    if(engaged(b, sel)){ note = "Too close to hold fire."; renderBattle(); return; }
    b.ow[sel.id] = true; lastAtk = [];
    note = shortName(sel) + " is on overwatch.";
    finishActivation();
  }
  function finishActivation(){
    busy = false; aim = null;
    if(sel) sel.done = true;
    sel = null;
    advance();
  }

  /* ---------------------------------------------------------------------
     THEIR GO

     Each Grukk is picked out and what it means to do is said before it
     does it - then it moves at a walk and its dice roll like yours. In
     Step mode it waits for you to say go.
     --------------------------------------------------------------------- */
  function advance(){
    if(checkEnd(b)){ save(); renderBattle(); return; }
    var before = b.round;
    var next = passTurn(b);
    if(next === "round"){
      var scored = "";
      endRound(b, function(t){ scored = t; });
      save();
      if(b.over){ renderBattle(); return; }
      note = (scored ? scored + " " : "") + "Round " + b.round + " begins.";
      lastAtk = [];
      renderBattle();
      return;
    }
    save();
    renderBattle();
    if(next === "e"){
      if(camp.step){ waitingStep = true; renderBattle(); }
      else wait(500, enemyGo);
    }
  }
  function describe(u, plan){
    var who = KINDS[u.kind].name;
    if(plan.act === "fight") return who + " lays into " + shortName(plan.target) + ".";
    if(plan.act === "charge") return who + " charges " + shortName(plan.target) + "!";
    var shots = alive(b, "p").some(function(p){ return dist(p, plan) <= weapon(u, "ranged").range && canSee(b, plan, p); });
    return who + (plan.x === u.x && plan.y === u.y ? " stands and " : " advances" + (shots ? " and " : ".")) + (shots ? "opens fire." : plan.x === u.x && plan.y === u.y ? "waits." : "");
  }
  function enemyGo(){
    waitingStep = false;
    var u = foeOrder(b)[0];
    if(!u){ advance(); return; }
    busy = true; lastAtk = [];
    var plan = enemyPlan(b, u);
    acting = u;
    note = describe(u, plan);
    renderBattle();
    function done(){ u.done = true; busy = false; acting = null; advance(); }
    wait(900, function(){
      if(plan.act === "fight"){ showAttacks(fight(b, u, plan.target, false), done); return; }
      var r = reach(b, u, KINDS[u.kind].M + (plan.act === "charge" ? 2 : 0));
      var path = pathTo(r, plan.x, plan.y);
      walk(u, path, function(){
        var ow = path.length > 1 ? overwatch(b, u, function(){}) : [];
        showAttacks(ow, function(){
          if(u.w <= 0){ done(); return; }
          if(plan.act === "charge"){ showAttacks(fight(b, u, plan.target, true), done); return; }
          var targets = alive(b, "p").filter(function(p){ return canShoot(b, u, p); }).sort(function(a, c){ return a.w - c.w; });
          if(targets.length) showAttacks([attack(b, u, targets[0], weapon(u, "ranged"), { moved:path.length > 1 })], done);
          else wait(400, done);
        });
      });
    });
  }

  /* ---------------------------------------------------------------------
     SCREENS
     --------------------------------------------------------------------- */
  function render(){
    var app = el("app"); app.innerHTML = ""; canvas = null; ctx = null;
    if(!camp){ camp = newCampaign(); save(); }
    camp.roster.forEach(persona);
    (camp.fallen || []).forEach(persona);
    if(view && view.kind === "card"){ renderCard(app, view.id); return; }
    if(camp.report){ renderDebrief(app); return; }
    if(camp.done){ renderVictory(app); return; }
    if(b){ renderBattleShell(app); return; }
    renderBriefing(app);
  }
  function findSoldier(id){

  }

      "<small>" + k.name + " · " + TRAITS[s.trait].n + " · " + s.kills + (s.kills === 1 ? " kill" : " kills") + "</small>" + (extra || "")));

  }

  function renderBriefing(app){

      "<p style=\"color:var(--muted);font-size:12.5px\">" + (m.type === "hold" ? "Score a VP for each relay you control at the end of rounds 2 to 5. Four VP wins." : "Kill three-quarters of them in five rounds" + (m.foes.boss ? " - and the Big Boss must die." : ".")) + "</p>"));
    var r = h("div", { "class":"panel" }, "<h3>The squad · tap a brother for his record</h3>");

    go.onclick = function(){ b = newBattle(camp.roster, camp.mi, Math.floor(Math.random() * 1e9)); sel = null; aim = null; note = "Your go. Tap a brother to pick him."; lastAtk = []; save(); render(); };
    s.appendChild(go);

  function renderCard(app, id){
    var s = findSoldier(id);
    if(!s){ view = null; render(); return; }
    var k = KINDS[s.kind], tr = TRAITS[s.trait];
    var rw = WEAPONS[k.ranged], mw = WEAPONS[k.melee];
    var sc = h("div", { "class":"scroll" });
    app.appendChild(sc);
    var top = h("div", { "class":"card" });
    var cv = document.createElement("canvas");
    portrait(cv, 116, s, s.dead);
    top.appendChild(cv);
    top.appendChild(h("div", { "class":"cbody" }, '<div class="cname">' + s.name + "</div>" +
      "<small>" + k.name + (s.rank ? " · " + RANK_NAMES[s.rank] : "") + "</small>" +

      '<div class="quote">“' + tr.q + "”</div>" + (s.dead ? '<div class="tag" data-k="dead" style="display:inline-block;margin-top:6px">Fell at ' + s.diedAt + "</div>" : "")));
    sc.appendChild(top);

    sc.appendChild(h("div", { "class":"panel" }, "<h3>Profile</h3>" +
      '<div class="stats">' + [["M", k.M], ["WS", k.WS + "+"], ["BS", BS + "+"], ["T", k.T], ["W", W], ["Sv", k.Sv + "+"], ["A", A]].map(function(p){
        return "<div><b>" + p[1] + "</b><small>" + p[0] + "</small></div>"; }).join("") + "</div>" +
      '<div class="row"><span>' + rw.name + "<small>Range " + rw.range + " · A" + rw.A + " · S" + rw.S + " · AP" + rw.AP + " · D" + rw.D + (rw.rapid ? " · rapid fire" : "") + (rw.heavy ? " · heavy" : "") + "</small></span></div>" +
      '<div class="row"><span>' + mw.name + "<small>Melee · A" + A + " · S" + mw.S + " · AP" + mw.AP + " · D" + mw.D + "</small></span></div>"));
    var slew = Object.keys(s.slew).map(function(kk){ return s.slew[kk] + " " + KINDS[kk].name.toLowerCase() + (s.slew[kk] > 1 ? "s" : ""); }).join(", ");
    var next = RANKS[s.rank + 1];
    sc.appendChild(h("div", { "class":"panel" }, "<h3>Service record</h3>" +
      row("Missions", s.missions) + row("Kills", s.kills + (slew ? "<small>" + slew + "</small>" : "")) +
      row("Squad's best", (s.mvp || 0) + (s.mvp === 1 ? " time" : " times")) + row("Fallen and saved", s.falls - (s.dead ? 1 : 0)) +
      row("Experience", s.xp + (next !== undefined && !s.dead ? "<small>" + (next - s.xp) + " to " + RANK_NAMES[s.rank + 1] + "</small>" : ""))));
    var d = h("div", { "class":"panel" }, "<h3>Deeds</h3>");
    if(!s.deeds.length) d.appendChild(h("p", { style:"color:var(--muted)" }, "Nothing yet. Give him time."));
    s.deeds.forEach(function(t){ d.appendChild(h("p", {}, t)); });
    sc.appendChild(d);
    var back = h("button", { "class":"btn" }, "Back");
    back.onclick = function(){ view = null; render(); };
    sc.appendChild(back);
  }
  function row(a, v){ return '<div class="row"><span>' + a + "</span><span style=\"text-align:right\">" + v + "</span></div>"; }

  function renderDebrief(app){
    var rep = camp.report, won = rep.result === "won";
    var sc = h("div", { "class":"scroll" });
    app.appendChild(sc);
    sc.appendChild(h("div", { "class":"banner" }, "<h2>" + (won ? "Victory" : "Defeat") + "</h2><p>" + rep.mission + "</p>"));
    var p = h("div", { "class":"panel" }, "<h3>Debrief · tap a brother for his card</h3>");
    rep.rows.forEach(function(r){
      var s = findSoldier(r.id); if(!s) return;
      var extra = "<small>This mission: " + r.kills + (r.kills === 1 ? " kill" : " kills") + " · +" + r.xp + " xp" + (r.best ? " · squad's best" : "") + "</small>" +
        '<small class="st" data-bad="' + /Killed/.test(r.status) + '">' + r.status + "</small>" + (r.promo ? '<small style="color:var(--sel)">Promoted — ' + r.promo + "</small>" : "");
      p.appendChild(soldierRow(s, extra));
    });
    sc.appendChild(p);
    if(rep.lines.length) sc.appendChild(h("div", { "class":"panel" }, "<h3>The squad</h3>" + rep.lines.map(function(l){ return "<p>" + l + "</p>"; }).join("")));
    var go = h("button", { "class":"btn" }, won ? (camp.done ? "The end of the oath" : "Next mission") : "Try again");
    go.onclick = function(){ camp.report = null; save(); render(); };
    sc.appendChild(go);
  }

  function renderBattleShell(app){
    app.appendChild(h("div", { "class":"statline", id:"stats" }));
    var rowEl = h("div", { "class":"boardrow" });
    canvas = h("canvas", { id:"board" });
    rowEl.appendChild(canvas);
    app.appendChild(rowEl);
    ctx = canvas.getContext("2d");
    app.appendChild(h("div", { "class":"unitbar", id:"unitbar" }));
    app.appendChild(h("div", { "class":"acts", id:"acts" }));
    app.appendChild(h("div", { "class":"log", id:"log" }));
    canvas.addEventListener("click", function(e){
      var r = canvas.getBoundingClientRect();
      tap(Math.floor((e.clientX - r.left) / T), Math.floor((e.clientY - r.top) / T));
    });
    size();
    renderBattle();
    if(b.turn === "e" && !b.over && !busy){
      if(camp.step){ waitingStep = true; renderBattle(); } else wait(500, enemyGo);
    }
  }

  function renderBattle(){
    if(!canvas) return;
    var m = MISSIONS[b.mi];
    var score = b.type === "hold" ? b.vp + '<span class="lbl">VP</span>' : kills(b) + "/" + purgeTarget(b) + '<span class="lbl">Kills</span>';
    el("stats").innerHTML = '<span class="big">' + b.round + '<span class="lbl">of ' + ROUNDS + '</span></span><span class="mid">' + m.name + " · " + (b.turn === "p" ? "your go" : "the Grukk") + '</span><span class="big">' + score + "</span>";
    var bar = el("unitbar");
    var who = sel || (acting && acting.side === "p" ? acting : null);
    if(sel && !acting){
      var k = KINDS[sel.kind], w = weapon(sel, "ranged");
      bar.innerHTML = '<canvas id="mini"></canvas><div><div class="nm">' + sel.name + "</div><small>W " + sel.w + "/" + sel.maxW + " · M" + k.M + " · BS" + stat(sel, "BS") + "+ · T" + k.T + " · Sv" + k.Sv + "+ · " + w.name + "</small>" +
        (note ? "<small>" + note + "</small>" : "") + "</div>";
      var s = findSoldier(sel.sid);
      if(s) portrait(el("mini"), 40, s, false);
    } else bar.innerHTML = "<div><small" + (acting ? ' style="color:var(--sel);font-size:13px"' : "") + ">" + (note || (b.turn === "p" ? "Tap a brother who has not gone yet." : "The Grukk are moving…")) + "</small></div>";
    var acts = el("acts"); acts.innerHTML = "";
    if(b.over){
      var won = b.over === "won";
      var nb = h("button", { "data-on":"true" }, (won ? "Victory" : "Defeat") + " — debrief");
      nb.onclick = function(){
        camp.report = debrief(camp, b);
        if(won) camp.mi++;
        if(camp.mi >= MISSIONS.length) camp.done = true;
        b = null; save(); render();
      };
      acts.appendChild(nb);
    } else if(waitingStep){
      var nx = h("button", { "data-on":"true" }, "Next: the Grukk act");
      nx.onclick = function(){ if(!busy) enemyGo(); };
      acts.appendChild(nx);
    } else if(b.turn === "p" && aim && aim.kind === "move"){
      var mv = h("button", { "data-on":"true" }, "Move here");
      mv.onclick = doMove;
      var cn = h("button", {}, "Cancel");
      cn.onclick = function(){ aim = null; renderBattle(); };
      acts.appendChild(mv); acts.appendChild(cn);
    } else if(b.turn === "p" && aim && aim.kind === "target"){
      aim.opts.forEach(function(o){
        var label = { shoot:"Shoot", charge:"Charge", fight:"Fight" }[o.act] + " · " + o.odds.kill + "% kill";
        var bt = h("button", { "data-on":"true" }, label);
        bt.onclick = function(){ doAct(o); };
        acts.appendChild(bt);
      });
      var cn2 = h("button", {}, "Cancel");
      cn2.onclick = function(){ aim = null; renderBattle(); };
      acts.appendChild(cn2);
    } else if(b.turn === "p"){
      var ow = h("button", {}, "Overwatch");
      ow.disabled = !sel || sel.done || busy;
      ow.onclick = holdFire;
      var end = h("button", {}, sel && sel.moved ? "Done" : "Hold position");
      end.disabled = !sel || sel.done || busy;
      end.onclick = function(){ if(sel && !sel.done && !busy){ lastAtk = []; finishActivation(); } };
      acts.appendChild(ow); acts.appendChild(end);
    }
    renderLog();
    draw();
  }
  function renderLog(){
    var l = el("log"); if(!l) return;
    if(aim && aim.kind === "target"){
      l.innerHTML = aim.opts.map(function(o){
        var d = o.odds;
        return '<div class="line"><b>' + { shoot:"Shoot", charge:"Charge", fight:"Fight" }[o.act] + "</b> " + KINDS[aim.t.kind].name + " with " + o.w.name + "</div>" +
          '<div class="step">' + d.A + (d.A === 1 ? " attack" : " attacks") + " · hit " + d.hitNeed + "+ · wound " + d.woundNeed + "+ · " + (d.sv ? "they save on " + d.sv + "+" : "no save") + (d.cover ? " (cover)" : "") + "</div>" +
          '<div class="step">About ' + d.dmg.toFixed(1) + " damage on average · <b style=\"min-width:0\">" + d.kill + "% to kill</b>" + (o.act !== "shoot" ? " · it strikes back if it lives" : "") + "</div>";
      }).join("");
      return;
    }
    if(lastAtk.length) l.innerHTML = lastAtk.filter(function(a){ return a.stage === undefined || a.stage >= 0; }).map(attackHtml).join("");
    else l.innerHTML = '<div class="line" style="color:var(--muted)">' + (aim && aim.kind === "move" ? "Move " + shortName(sel) + " here? Press Move to commit." : "Dice appear here.") + "</div>";
    l.scrollTop = l.scrollHeight;
  }

  function renderVictory(app){
    var sc = h("div", { "class":"scroll" });
    app.appendChild(sc);
    sc.appendChild(h("div", { "class":"banner" }, "<h2>Skarg is dead</h2><p>The warband is broken and the oath is kept. Their names go on the roll of honour.</p>"));
    var r = h("div", { "class":"panel" }, "<h3>Roll of honour</h3>");
    camp.roster.concat(camp.fallen || []).forEach(function(s){ r.appendChild(soldierRow(s, s.dead ? "<small>Fell at " + s.diedAt + "</small>" : "")); });
    sc.appendChild(r);
    var b2 = h("button", { "class":"btn" }, "A new oath");
    b2.onclick = function(){ var keep = { pace:camp.pace, step:camp.step }; camp = newCampaign(); camp.pace = keep.pace; camp.step = keep.step; b = null; save(); render(); };
    sc.appendChild(b2);
  }

  el("restart").onclick = function(){
    if(!window.confirm("Abandon this campaign and start a new one?")) return;
    camp = newCampaign(); b = null; sel = null; aim = null; view = null; busy = false; save(); render();
  };
  window.addEventListener("resize", function(){ if(canvas){ size(); draw(); } });

  camp = load();
  if(camp){
    b = camp.battle || null;
    camp.fallen = camp.fallen || [];
    if(!camp.pace) camp.pace = "normal";
    if(b) b.units.forEach(function(u){
      if(u.side !== "p") return;
      var s = camp.roster.filter(function(x){ return x.id === u.sid; })[0];
      if(s){ persona(s); u.look = s.look; }
    });
  }
  render();

  window.__oath = { get camp(){ return camp; }, get b(){ return b; }, tap:tap, KINDS:KINDS };
})();
</script>
</body>
</html>
