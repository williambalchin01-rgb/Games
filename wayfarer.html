    if(p.relic >= 0 && (st.up.scanner >= 2 || st.done[pkey(s, p)])) t.push(tag("Strange readings", "hot"));
    return t.join("");
  }
  function findsOf(p){
    var f = [];
    if(p.life >= 0) f.push("<b>" + LIFE[p.life].name + "</b>");
    if(p.min >= 0) f.push("<b>" + MINERALS[p.min].name + "</b>");
    if(p.relic >= 0) f.push("<i>" + RELICS[p.relic].name + "</i>");
    return f.length ? f.join(" · ") : "Nothing but " + WORLDS[p.type].name.toLowerCase();
  }

  function paintHero(body, s, pl){
    var box = node("div", "hero");
    var cv = document.createElement("canvas");
    box.appendChild(cv);
    var cap = node("div", "cap");
    box.appendChild(cap);
    body.appendChild(box);
    var W = Math.max(200, body.getBoundingClientRect().width || 320), H = 170, k = dpr();
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    var c = cv.getContext("2d");
    c.fillStyle = "#070B10"; c.fillRect(0, 0, cv.width, cv.height);
    speckle(c, cv.width, cv.height, hash(st.seed, s.i, 55));
    var p = view.sel >= 0 ? pl[view.sel] : null;
    if(!p){
      starArt(c, cv.height, s.cls, cv.width / 2, cv.height * 0.45, cv.height * 0.14);
      cap.innerHTML = "<b>" + s.name + "</b><span>" + CLASSES[s.cls].name + ". " + CLASSES[s.cls].desc + "</span>";
      return;
    }
    starArt(c, cv.height, s.cls, -cv.height * 0.05, -cv.height * 0.05, cv.height * 0.12);
    var size = Math.round(cv.height * 0.9);
    c.drawImage(worldArt(p, size, p.type === "ringed" ? 0.5 : 0.6 + p.size * 0.1), cv.width - size - cv.height * 0.04, (cv.height - size) / 2);
    cap.setAttribute("data-side", "true");
    var w = WORLDS[p.type];
    cap.innerHTML = "<b>" + planetName(s, p) + "</b><span>" + w.name + ". " + w.desc + "</span>";
  }

  function paintSystem(body){
    var s = star(st, st.at), pl = planetsOf(G(st), s);
    el("sheet-title").textContent = s.name;
    el("sheet-sub").textContent = CLASSES[s.cls].name + " · " + (pl.length === 1 ? "1 world" : pl.length + " worlds");
    paintHero(body, s, pl);

    var sc = node("div", "card");
    if(view.sel < 0) sc.setAttribute("aria-pressed", "true");
    sc.appendChild(artCanvas(56, function(c, px){ starArt(c, px, s.cls); }));
    var tags = [];
    if(s.home) tags.push(tag("Home", "good"));
    else if(isDock(st, s.i)) tags.push(tag("Outpost", "good"));
    if(SCOOP[st.up.scoop] && CLASSES[s.cls].scoop) tags.push(tag("Scoop +" + SCOOP[st.up.scoop]));
    if(!CLASSES[s.cls].scoop) tags.push(tag("Cannot scoop"));
    sc.appendChild(node("div", "body", '<div class="nm">' + s.name + '</div><div class="short">' + CLASSES[s.cls].name +
                                     '</div><div class="tags">' + tags.join("") + "</div>"));
    sc.addEventListener("click", function(){ view.sel = -1; paintSheet(); });
    body.appendChild(sc);

    if(!pl.length) body.appendChild(node("p", "empty", s.heart ? "Nothing orbits the Heart. Nothing could." : "No worlds here, only the star."));
    pl.forEach(function(p){
      var d = node("div", "card"), key = pkey(s, p), done = !!st.done[key];
      if(view.sel === p.k) d.setAttribute("aria-pressed", "true");
      d.appendChild(artCanvas(56, function(c, px){ c.drawImage(worldArt(p, px), 0, 0); }));
      var inner = '<div class="nm">' + planetName(s, p) + '</div><div class="short">' + WORLDS[p.type].name + "</div>";
      inner += done ? '<ul class="finds"><li>' + findsOf(p) + "</li></ul>" : '<div class="tags">' + hints(s, p) + "</div>";
      d.appendChild(node("div", "body", inner));
      var b = document.createElement("button");
      b.className = "act";
      if(landable(p)){
        if(done){ b.textContent = "Surveyed"; b.setAttribute("data-done", "true"); b.disabled = true; }
        else {
          b.textContent = "Land · " + landCost(p) + " fuel";
          b.disabled = st.fuel < landCost(p) || st.pending !== null;
          b.addEventListener("click", function(e){ e.stopPropagation(); doLand(p.k); });
        }
      } else {
        if(done){ b.textContent = "Skimmed"; b.setAttribute("data-done", "true"); b.disabled = true; }
        else {
          var room = Math.min(WORLDS[p.type].fuel, tank(st) - st.fuel);
          b.textContent = room > 0 ? "Skim +" + room + " fuel" : "Skim";
          b.disabled = st.pending !== null;
          b.addEventListener("click", function(e){ e.stopPropagation(); doSkim(p.k); });
        }
      }
      d.appendChild(b);
      d.addEventListener("click", function(){ view.sel = p.k; paintSheet(); });
      body.appendChild(d);
    });

    if(isDock(st, s.i)){
      body.appendChild(node("p", "note", (s.home ? "Home" : "Your outpost") +
        ": fuel, a buyer for your data, and a yard to fit upgrades. Your docks earn " +
        num(daily(st)) + " credits a day between them."));
    } else if(!s.heart){
      var ob = node("div", "card");
      var cb = canBuild(st), cost = outpostCost(st);
      ob.appendChild(artCanvas(56, function(c, px){
        c.strokeStyle = "#4FA88B"; c.lineWidth = px * 0.05;
        c.beginPath(); c.moveTo(px / 2, px * 0.2); c.lineTo(px * 0.8, px / 2); c.lineTo(px / 2, px * 0.8); c.lineTo(px * 0.2, px / 2);
        c.closePath(); c.stroke();
      }));
      ob.appendChild(node("div", "body", '<div class="nm">Build an outpost</div><div class="short">Refuels you, buys data, fits upgrades, lights up ' +
        OUTPOST_SIGHT + " ly round it and earns about " + num(outpostDaily(st, s.i)) + " credits a day.</div>"));
      var bb = document.createElement("button");
      bb.className = "act";
      bb.textContent = num(cost);
      bb.disabled = !cb.ok;
      bb.addEventListener("click", function(e){
        e.stopPropagation();
        var r = build(st);
        if(!r) return;
        say(["Outpost built at " + s.name + "."].concat(r).join(" "));
        after();
      });
      ob.appendChild(bb);
      body.appendChild(ob);
    }
  }

  function doLand(k){
    var s = star(st, st.at), p = planetsOf(G(st), s)[k];
    var r = land(st, k);
    if(!r) return;
    view.sel = k;
    say(planetName(s, p) + ": " + r.finds.map(function(f){
      return f.name + (f.fresh ? " (new)" : "") + " " + num(f.v);
    }).join(", ") + ".");
    after();
  }
  function doSkim(k){
    var s = star(st, st.at), p = planetsOf(G(st), s)[k];
    var r = skim(st, k);
    if(!r) return;
    view.sel = k;
    var bits = r.finds.map(function(f){ return f.name + (f.fresh ? " (new)" : "") + " " + num(f.v); });
    say(planetName(s, p) + ": +" + r.fuel + " fuel. " + bits.join(", ") + ".");
    after();
  }

  function paintShip(body){
    el("sheet-title").textContent = "Ship";
    var docked = isDock(st, st.at);
    el("sheet-sub").textContent = docked ? "Docked" : "In flight";
    body.appendChild(node("p", "note", "Carrying " + num(st.data) + " in unsold data. " +
      (docked ? "Fit anything you can afford." : "Upgrades are fitted at a dock.") +
      " Docks earn " + num(daily(st)) + " credits a day."));
    UPGRADES.forEach(function(u){
      var lvl = st.up[u.key], cost = upgradeCost(st, u.key);
      var d = node("div", "card");
      var pips = "";
      for(var i = 1; i <= 4; i++) pips += '<span data-on="' + (lvl >= i) + '"></span>';
      function fmt(v){ return u.unit === "×" ? v + "×" : v + u.unit; }
      var now = cost === null ? fmt(u.vals[lvl]) + ", fully fitted" : fmt(u.vals[lvl]) + " → " + fmt(u.vals[lvl + 1]);
      d.appendChild(node("div", "body", '<div class="nm">' + u.name + '</div><div class="short">' + now + "</div>" +
        '<div class="short">' + u.what + '</div><div class="pips">' + pips + "</div>"));
      if(cost !== null){
        var b = document.createElement("button");
        b.className = "act";
        b.textContent = num(cost);
        b.disabled = !docked || st.cash < cost;
        b.addEventListener("click", function(){
          if(!buy(st, u.key)) return;
          say(u.name + " upgraded.");
          plan();
          after();
        });
        d.appendChild(b);
      }
      body.appendChild(d);
    });
    body.appendChild(node("p", "note", count(st.visited) + " systems visited · " + st.jumps + " jumps · " +
      st.lands + " landings · " + num(st.earned) + " earned from data"));
  }

  function paintCodex(body){
    el("sheet-title").textContent = "Codex";
    el("sheet-sub").textContent = count(st.codex) + " of " + CODEX_TOTAL;
    function where(k){
      var at = st.codex[k];
      return at ? " · first seen at " + star(st, at - 1).name : "";
    }
    function shelf(title, items){
      var got = items.filter(function(it){ return st.codex[it.key]; }).length;
      var h = node("div", "grouphead", "<span>" + title + "</span><span>" + got + " / " + items.length + "</span>");
      body.appendChild(h);
      body.appendChild(node("div", "bar", '<i style="width:' + Math.round(got / items.length * 100) + '%"></i>'));
      items.forEach(function(it){
        var known = !!st.codex[it.key];
        var e = node("div", "entry");
        if(!known) e.setAttribute("data-unknown", "true");
        e.innerHTML = known ? it.name + "<small>" + it.desc + where(it.key) + "</small>" : "Not yet found" + (it.hint ? "<small>" + it.hint + "</small>" : "");
        body.appendChild(e);
      });
    }
    shelf("Stars", CLASS_ORDER.map(function(c){ return { key:"s:" + c, name:CLASSES[c].name, desc:CLASSES[c].desc }; }));
    shelf("Worlds", WORLD_ORDER.map(function(t){ return { key:"p:" + t, name:WORLDS[t].name, desc:WORLDS[t].desc }; }));
    shelf("Life", LIFE.map(function(x, i){ return { key:"l:" + i, name:x.name, desc:x.desc,
      hint:"On " + x.on.map(function(t){ return WORLDS[t].name.toLowerCase(); }).join(" or ") + "s" }; }));
    shelf("Minerals", MINERALS.map(function(x, i){ return { key:"m:" + i, name:x.name, desc:x.desc,
      hint:"On " + x.on.map(function(t){ return WORLDS[t].name.toLowerCase(); }).join(" or ") + "s" }; }));
    shelf("Relics", RELICS.map(function(x, i){ return { key:"r:" + i, name:x.name, desc:x.desc, hint:"Commoner towards the core" }; }));
    shelf("Phenomena", ANOMALIES.map(function(a){ return { key:"x:" + a.id, name:a.name, desc:a.desc }; })
      .concat([{ key:"x:heart", name:HEART.name, desc:HEART.desc, hint:"At the very centre" }]));
  }

  function paintGoals(body){
    el("sheet-title").textContent = "Goals";
    var done = GOALS.filter(function(g){ return st.goals[g.id]; }).length;
    el("sheet-sub").textContent = done + " of " + GOALS.length;
    GOALS.forEach(function(g){
      var d = node("div", "goal");
      if(st.goals[g.id]) d.setAttribute("data-done", "true");
      d.innerHTML = '<span class="tick"></span><span class="nm">' + g.text + "<small>" + g.note + "</small></span>" +
                    '<span class="amt">' + num(g.pays) + "</span>";
      body.appendChild(d);
    });
    body.appendChild(node("p", "note", "Furthest from Hearth: " + st.far + " ly · day " + num(st.day)));
  }

  function paintAnom(body){
    var i = view.at !== undefined ? view.at : st.pending;
    if(i === null || i === undefined){ close(); return; }
    var s = star(st, i), a = ANOMALIES[s.anom];
    el("sheet-title").textContent = view.res && !view.res.left ? a.name : "Something here";
    el("sheet-sub").textContent = s.name;
    var box = node("div", "story");
    box.appendChild(node("p", "", a.text));
    if(view.res){
      var r = view.res, gains = [];
      if(r.fuel) gains.push((r.fuel > 0 ? "+" : "") + r.fuel + " fuel");
      if(r.data) gains.push("+" + num(r.data) + " data");
      if(r.chart !== null && r.chart !== undefined) gains.push("Charted " + star(st, r.chart).name + ", " + dist(s, star(st, r.chart)).toFixed(0) + " ly away");
      if(r.fold !== null && r.fold !== undefined) gains.push("Now at " + star(st, r.fold).name);
      box.appendChild(node("p", "then", r.text + (gains.length ? " " + gains.join(" · ") + "." : "")));
      body.appendChild(box);
      return;
    }
    body.appendChild(box);
    var row = node("div", "choice");
    var go = node("button", "", a.go);
    go.setAttribute("data-primary", "true");
    var no = node("button", "", "Leave it");
    function choose(yes){
      var r = answer(st, yes);
      view.res = r;
      view.at = i;
      if(r && r.fold !== null && r.fold !== undefined){ centreOn(st.at, true); }
      plan();
      if(r) say(r.left ? "You leave it be." : r.text);
      after();
    }
    go.addEventListener("click", function(){ choose(true); });
    no.addEventListener("click", function(){ choose(false); });
    row.appendChild(go); row.appendChild(no);
    body.appendChild(row);
  }

  /* ---------------------------------------------------------------------
     CHROME
     --------------------------------------------------------------------- */
  function syncStats(){
    el("cash").innerHTML = num(st.cash) + '<span class="lbl">Credits</span>';
    el("fuel").innerHTML = st.fuel + "/" + tank(st) + '<span class="lbl">Fuel</span>';
    el("where").textContent = "Day " + num(st.day) + " · " + star(st, st.at).name;
  }

  function syncGo(){
    var b = el("go");
    b.hidden = true; b.disabled = false;
    if(view || anim) return;
    if(st.pending !== null){ b.hidden = false; b.textContent = "Something here · take a look"; return; }
    if(st.target !== null && st.target !== undefined && st.target !== st.at){
      b.hidden = false;
      var t = star(st, st.target), r = planned;
      if(!r){ b.textContent = "No known way to " + t.name; b.disabled = true; return; }
      var next = star(st, r.path[1]), c = canJump(st, r.path[1]);
      if(r.path.length === 2) b.textContent = "Jump to " + t.name + " · " + c.cost + " fuel";
      else b.textContent = "Towards " + t.name + ": " + next.name + " · " + c.cost + " fuel (" + (r.path.length - 1) + " jumps, " + r.fuel + " fuel)";
      if(!c.ok) b.disabled = true;
      return;
    }
    if(adrift(st)){
      b.hidden = false;
      b.textContent = "Call a tow to " + star(st, towTo(st)).name + " · costs " + num(Math.floor(st.data / 2)) + " data";
    }
  }

  function clockText(){
    if(isDock(st, st.at)) return "Docked · " + (st.data ? num(st.data) + " unsold" : "tanks full");
    var h = homeward(st), bits = [num(st.data) + " unsold"];
    if(!h) bits.push("no known way to a dock");
    else if(h.fuel > st.fuel) bits.push("dock " + h.fuel + " fuel away · not enough");
    else bits.push("dock " + (h.path.length - 1) + (h.path.length === 2 ? " jump, " : " jumps, ") + h.fuel + " fuel");
    return bits.join(" · ");
  }

  function syncChrome(){
    var inSheet = !!view;
    el("maprow").hidden = inSheet;
    el("sheet").hidden = !inSheet;
    el("howto").hidden = inSheet || st.jumps > 3;
    el("back-to-map").hidden = !inSheet;
    el("system").hidden = inSheet;
    el("ship").hidden = inSheet && view.kind === "ship";
    el("codex").hidden = inSheet && view.kind === "codex";
    el("goals").hidden = inSheet && view.kind === "goals";
    syncStats();
    var cl = el("clockline");
    cl.textContent = clockText();
    cl.setAttribute("data-low", String(adrift(st)));
    syncGo();
    if(inSheet) paintSheet();
    else resize();
  }

  function after(){
    claimGoals(st, function(t){ say(said + " " + t); });
    save();
    syncChrome();
  }

  el("go").addEventListener("click", goNext);
  el("back-to-map").addEventListener("click", function(){
    if(view && view.kind === "anom" && view.res && view.res.fold !== undefined && view.res.fold !== null) centreOn(st.at, true);
    close();
  });
  el("system").addEventListener("click", function(){ open({ kind:"system", sel:-1, top:true }); });
  el("ship").addEventListener("click", function(){ open({ kind:"ship", top:true }); });
  el("codex").addEventListener("click", function(){ open({ kind:"codex", top:true }); });
  el("goals").addEventListener("click", function(){ open({ kind:"goals", top:true }); });
  el("restart").addEventListener("click", function(){
    if(!window.confirm("Leave this galaxy for a new one? Everything here is lost.")) return;
    st = newGame();
    view = null;
    centreOn(st.at);
    say("A new galaxy. Hearth is home; the Heart is a long way in.");
    after();
  });

  window.addEventListener("resize", function(){ if(!view) resize(); });
  window.addEventListener("orientationchange", function(){ setTimeout(function(){ if(!view) resize(); }, 120); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden && st) save(); });

  st = load();
  if(st && st.cam){ cam = { x:st.cam.x, y:st.cam.y, s:st.cam.s }; }
  if(!st){
    st = newGame();
    say("Hearth is home. Tap a star to plot a course; the Heart is a long way in.");
    resize();
    centreOn(st.at);
  }
  plan();
  after();
  if(st.pending !== null) open({ kind:"anom" });

  window.__wayfarer = {
    get st(){ return st; }, set st(v){ st = v; },
    galaxy:galaxy, planetsOf:planetsOf, jump:jump, land:land, answer:answer, route:route,
    goTo:function(i){ st.target = i; plan(); goNext(); }, cam:cam, redraw:function(){ syncChrome(); }
  };
})();
</script>
</body>
</html>
