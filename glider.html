<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151C24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Glider</title>
<link rel="stylesheet" href="./app.css">
<style>
  .statline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 2px 8px}
  .flown{font-size:22px;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .flown span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:6px}

  /* the question owns the top half; the flight the bottom */
  .wrap{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;padding:2px 0}
  .top{flex:0 0 auto}
  .bottom{flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px;display:flex;flex-direction:column;gap:9px;
  }
  .qnum{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
        display:flex;justify-content:space-between;gap:8px}
  .prompt{font-size:19px;font-weight:300;line-height:1.3;margin:0}

  .timer{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .timer i{display:block;height:100%;background:var(--accent);transition:width .12s linear}
  .timer[data-low="true"] i{background:#E0574A}

  .entry{display:flex;gap:8px}
  .entry input{
    flex:1;min-width:0;background:#1A232C;border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font:inherit;font-size:16px;padding:11px 12px;
  }
  .entry input:focus{outline:none;border-color:var(--accent)}
  .entry input[data-wrong="true"]{border-color:#E0574A;animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .entry button{
    flex:none;background:var(--accent);color:var(--ground);border-radius:8px;
    padding:0 16px;font-size:14px;font-weight:500;
  }
  .entry button:disabled{background:var(--line);color:var(--muted)}

  .verdict{min-height:34px;font-size:13px;color:var(--muted);display:flex;align-items:center}
  .verdict b{color:var(--ink);font-weight:500;margin-right:5px}
  .verdict[data-tone="hit"]{color:var(--accent)}
  .verdict[data-tone="wrong"]{color:#E0574A}
  .verdict.flash{animation:rise .35s ease}
  @keyframes rise{0%{transform:translateY(5px);opacity:0}100%{transform:none;opacity:1}}

  /* ---- the flight ---- */
  .sky{
    position:relative;flex:1;min-height:120px;border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(#16222E 0%, #1B2B39 45%, #223447 100%);
    border:1px solid var(--line);
  }
  .cloud{position:absolute;border-radius:40px;background:rgba(255,255,255,.045);pointer-events:none}
  .mark{position:absolute;top:0;bottom:18px;width:1px;background:rgba(255,255,255,.07)}
  .mark b{
    position:absolute;bottom:-15px;left:2px;font-size:8px;font-weight:400;letter-spacing:.05em;
    color:rgba(255,255,255,.28);white-space:nowrap;
  }
  .ground{position:absolute;left:0;right:0;bottom:0;height:18px;background:rgba(0,0,0,.25);
          border-top:1px solid rgba(255,255,255,.10)}
  .trail{
    position:absolute;left:3%;bottom:38%;height:0;border-top:1px dashed rgba(232,207,92,.42);
    transition:width .85s cubic-bezier(.25,.8,.35,1);
  }
  .plane{
    position:absolute;bottom:38%;width:30px;height:30px;margin-bottom:-15px;
    transition:left .85s cubic-bezier(.25,.8,.35,1), bottom .85s cubic-bezier(.3,.9,.4,1);
  }
  .plane svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .plane.launch{animation:bob .85s ease}
  @keyframes bob{0%{transform:rotate(-14deg)}40%{transform:rotate(-7deg)}100%{transform:none}}

  .howto{margin:0;text-align:center;font-size:12px;color:var(--muted)}
  @media (max-height: 700px){ .howto{display:none} .bottom{min-height:118px} }

  .recap{display:flex;flex-direction:column;gap:6px;margin-top:10px;text-align:left}
  .rec{display:flex;gap:9px;align-items:baseline;font-size:12.5px;border-top:1px solid var(--line);padding-top:6px}
  .rec .n{color:var(--muted);font-variant-numeric:tabular-nums;width:14px;flex:none}
  .rec .mine{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .p{font-variant-numeric:tabular-nums;color:var(--accent)}
  .rec[data-tone="miss"] .p{color:#E0574A}
  .rec .best{display:block;font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <a class="back" href="./index.html">&larr; Arcade</a>
  <div class="eyebrow" id="reach">Still on the desk</div>
</header>

<div class="chiprow" id="modes"></div>

<div class="statline">
  <span class="flown"><span id="flown-n">0</span><span>metres flown</span></span>
  <span class="eyebrow">Best <span id="best-n">&mdash;</span></span>
</div>

<div class="wrap">
  <div class="top">
    <div class="card" id="play">
      <div class="qnum"><span id="qnum">Throw 1 of 7</span><span id="tries"></span></div>
      <p class="prompt" id="prompt">&nbsp;</p>
      <div class="timer" id="timer"><i id="timer-bar"></i></div>
      <div class="entry">
        <input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" enterkeyhint="go" placeholder="Your answer">
        <button id="throw">Throw</button>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="sky" id="sky">
      <div class="trail" id="trail"></div>
      <div class="plane" id="plane">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M23 12 L2.5 4 L10 12 Z" fill="#F4E58C"/>
          <path d="M23 12 L10 12 L2.5 20 Z" fill="#C9AE3F"/>
          <path d="M23 12 L10 12" stroke="#8C7A28" stroke-width="0.9" fill="none"/>
          <path d="M23 12 L2.5 4" stroke="#FBF3C4" stroke-width="0.7" fill="none"/>
        </svg>
      </div>
      <div class="ground"></div>
    </div>
    <p class="howto">A rarer answer throws it further. Wrong guesses cost only time.</p>
  </div>
</div>

<div class="win" id="over" hidden>
  <h2 id="over-title">Landed</h2>
  <p id="over-text"></p>
  <div class="recap" id="recap"></div>
  <div class="controls"><button class="ctrl" id="again">Throw again</button></div>
</div>

<p class="note" id="note" hidden>Storage is blocked here, so your throws won't be saved.</p>

<script>
(function(){
  "use strict";

  var KEY = "arcade.glider.v1";
  var PROMPTS = 7, SECONDS = 30;

  var PACKS = [
  { q:"Name a country in Africa", a:[
    "Egypt","South Africa","Nigeria","Kenya","Morocco","Ethiopia","Ghana","Algeria","Tunisia","Libya",
    "Zimbabwe","Tanzania","Uganda","Sudan","Somalia","Senegal","Cameroon","Angola","Mozambique","Zambia",
    "Botswana","Namibia","Rwanda","Ivory Coast","Mali","Madagascar","Democratic Republic of the Congo","Republic of the Congo","Niger","Chad",
    "Burkina Faso","Malawi","Mauritius","Gabon","Benin","Liberia","Sierra Leone","Gambia","Togo","Guinea",
    "Mauritania","South Sudan","Eritrea","Djibouti","Burundi","Lesotho","Eswatini","Seychelles","Cape Verde","Equatorial Guinea",
    "Guinea-Bissau","Comoros","Sao Tome and Principe","Central African Republic"],
    alt:{ "Ivory Coast":["Cote d'Ivoire"], "Democratic Republic of the Congo":["DRC","DR Congo","Congo-Kinshasa","Zaire"],
          "Republic of the Congo":["Congo","Congo-Brazzaville"], "Eswatini":["Swaziland"],
          "Cape Verde":["Cabo Verde"], "Sao Tome and Principe":["Sao Tome"], "Central African Republic":["CAR"] } },

  { q:"Name a US state", a:[
    "California","Texas","Florida","New York","Hawaii","Alaska","Nevada","Arizona","Colorado","Washington",
    "Oregon","Illinois","Ohio","Michigan","Georgia","Virginia","Massachusetts","Pennsylvania","New Jersey","North Carolina",
    "Louisiana","Tennessee","Missouri","Minnesota","Wisconsin","Indiana","Maryland","South Carolina","Alabama","Kentucky",
    "Oklahoma","Utah","Iowa","Kansas","Arkansas","Mississippi","Connecticut","New Mexico","Nebraska","Idaho",
    "Maine","Montana","West Virginia","New Hampshire","Rhode Island","Delaware","South Dakota","North Dakota","Wyoming","Vermont"] },

  { q:"Name a member state of the European Union", a:[
    "France","Germany","Italy","Spain","Netherlands","Belgium","Portugal","Greece","Ireland","Austria",
    "Poland","Sweden","Denmark","Finland","Czechia","Hungary","Romania","Croatia","Bulgaria","Slovakia",
    "Slovenia","Lithuania","Latvia","Estonia","Cyprus","Luxembourg","Malta"],
    alt:{ "Czechia":["Czech Republic"], "Netherlands":["Holland"] } },

  { q:"Name a letter of the Greek alphabet", a:[
    "Alpha","Beta","Gamma","Delta","Omega","Sigma","Pi","Theta","Lambda","Epsilon",
    "Zeta","Phi","Mu","Kappa","Omicron","Tau","Eta","Rho","Chi","Psi",
    "Nu","Iota","Xi","Upsilon"] },

  { q:"Name a country in South America", a:[
    "Brazil","Argentina","Chile","Peru","Colombia","Venezuela","Ecuador","Bolivia","Uruguay","Paraguay",
    "Guyana","Suriname"] },

  { q:"Name a Canadian province or territory", a:[
    "Ontario","Quebec","British Columbia","Alberta","Nova Scotia","Manitoba","Saskatchewan","New Brunswick","Newfoundland and Labrador","Yukon",
    "Prince Edward Island","Northwest Territories","Nunavut"],
    alt:{ "Newfoundland and Labrador":["Newfoundland"], "Prince Edward Island":["PEI"] } },

  { q:"Name a sign of the zodiac", a:[
    "Leo","Scorpio","Aries","Gemini","Taurus","Cancer","Virgo","Libra","Pisces","Aquarius",
    "Sagittarius","Capricorn"] },

  { q:"Name a country that borders Germany", a:[
    "France","Netherlands","Belgium","Poland","Austria","Switzerland","Denmark","Czechia","Luxembourg"],
    alt:{ "Czechia":["Czech Republic"], "Netherlands":["Holland"] } },

  { q:"Name a country that borders Russia", a:[
    "China","Ukraine","Finland","Norway","Poland","Belarus","Kazakhstan","Mongolia","North Korea","Estonia",
    "Latvia","Lithuania","Georgia","Azerbaijan"] },

  { q:"Name one of the first twenty chemical elements", a:[
    "Hydrogen","Helium","Carbon","Oxygen","Nitrogen","Sodium","Calcium","Neon","Aluminium","Silicon",
    "Sulfur","Chlorine","Magnesium","Potassium","Lithium","Phosphorus","Argon","Boron","Fluorine","Beryllium"],
    alt:{ "Aluminium":["Aluminum"], "Sulfur":["Sulphur"] } },

  { q:"Name one of the twenty standard amino acids", a:[
    "Glycine","Alanine","Lysine","Cysteine","Tryptophan","Tyrosine","Serine","Leucine","Valine","Proline",
    "Arginine","Histidine","Glutamine","Asparagine","Methionine","Threonine","Phenylalanine","Isoleucine","Aspartic acid","Glutamic acid"],
    alt:{ "Aspartic acid":["Aspartate"], "Glutamic acid":["Glutamate"] } },

  { q:"Name a sovereign country in Oceania", a:[
    "Australia","New Zealand","Fiji","Papua New Guinea","Samoa","Tonga","Vanuatu","Solomon Islands","Micronesia","Palau",
    "Kiribati","Nauru","Tuvalu","Marshall Islands"],
    alt:{ "Micronesia":["Federated States of Micronesia","FSM"] } },

  { q:"Name a sovereign country in the Caribbean", a:[
    "Cuba","Jamaica","Haiti","Dominican Republic","Bahamas","Barbados","Trinidad and Tobago","Grenada","Saint Lucia","Antigua and Barbuda",
    "Dominica","Saint Vincent and the Grenadines","Saint Kitts and Nevis"],
    alt:{ "Trinidad and Tobago":["Trinidad"], "Antigua and Barbuda":["Antigua"],
          "Saint Vincent and the Grenadines":["St Vincent"], "Saint Kitts and Nevis":["St Kitts"],
          "Saint Lucia":["St Lucia"] } },

  { q:"Name one of the ten main cloud types", a:[
    "Cumulus","Cirrus","Stratus","Cumulonimbus","Nimbostratus","Altocumulus","Stratocumulus","Altostratus","Cirrostratus","Cirrocumulus"] },

  { q:"Name an Australian state or territory", a:[
    "New South Wales","Victoria","Queensland","Western Australia","Tasmania","South Australia","Northern Territory","Australian Capital Territory"],
    alt:{ "Australian Capital Territory":["ACT"], "New South Wales":["NSW"], "Northern Territory":["NT"],
          "Western Australia":["WA"], "South Australia":["SA"] } },

  { q:"Name a property on a UK Monopoly board", a:[
    "Mayfair","Park Lane","Old Kent Road","Bond Street","Oxford Street","Regent Street","Piccadilly","Trafalgar Square","Leicester Square","Whitechapel Road",
    "The Angel Islington","Pall Mall","Strand","Fleet Street","Bow Street","Marlborough Street","Vine Street","Northumberland Avenue","Coventry Street","Euston Road",
    "Whitehall","Marylebone Station","King's Cross Station","Liverpool Street Station","Fenchurch Street Station","Electric Company","Water Works"],
    alt:{ "The Angel Islington":["Angel Islington","The Angel"], "King's Cross Station":["Kings Cross"],
          "Marylebone Station":["Marylebone"], "Liverpool Street Station":["Liverpool Street"],
          "Fenchurch Street Station":["Fenchurch Street"] } },

  { q:"Name a faction from Warhammer 40,000", a:[
    "Space Marines","Orks","Tyranids","Necrons","Eldar","Tau","Chaos Space Marines","Imperial Guard","Adeptus Mechanicus","Dark Eldar",
    "Sisters of Battle","Grey Knights","Chaos Daemons","Genestealer Cults","Death Guard","Thousand Sons","World Eaters","Imperial Knights","Custodes","Harlequins",
    "Leagues of Votann"],
    alt:{ "Eldar":["Aeldari","Craftworlds","Craftworld Eldar"], "Dark Eldar":["Drukhari"],
          "Tau":["T'au","Tau Empire"], "Imperial Guard":["Astra Militarum"],
          "Sisters of Battle":["Adepta Sororitas"], "Custodes":["Adeptus Custodes"],
          "Space Marines":["Adeptus Astartes"], "Leagues of Votann":["Votann","Squats"] } },

  { q:"Name a planet or IAU dwarf planet in the solar system", a:[
    "Earth","Mars","Jupiter","Saturn","Venus","Mercury","Neptune","Uranus","Pluto","Ceres",
    "Eris","Haumea","Makemake"] }
  ];

  /* Six bands by where an answer sits in its list. Everyone reaches for Egypt;
     almost nobody for Comoros; the throw follows that and nothing else. */
  var TIERS = [
    { at:0.12, name:"Wobble",       pts:4 },
    { at:0.30, name:"Glide",        pts:8 },
    { at:0.50, name:"Soar",         pts:16 },
    { at:0.70, name:"Sail",         pts:32 },
    { at:0.88, name:"Thermal",      pts:64 },
    { at:1.01, name:"Stratosphere", pts:100 }
  ];
  var PER_POINT = 1;                       // a point is a metre; a perfect seven is 700
  var MAX = PROMPTS * 100 * PER_POINT;
  var REACH = [
    { to:40,  name:"Still on the desk" },
    { to:120, name:"Across the room" },
    { to:260, name:"Down the corridor" },
    { to:450, name:"Over the playground" },
    { to:640, name:"Out past the treeline" },
    { to:1e9, name:"Somewhere over the horizon" }
  ];

  /* Spread across the list rather than against its length, so the last name on
     any list is worth the most. Dividing by n left a short category - the eight
     Australian states - unable to award the best throw at all, however obscure
     the answer given. */
  function tierFor(rank, n){
    var f = n > 1 ? rank / (n - 1) : 1;
    for(var i = 0; i < TIERS.length; i++) if(f < TIERS[i].at) return TIERS[i];
    return TIERS[TIERS.length - 1];
  }
  function reachFor(m){
    for(var i = 0; i < REACH.length; i++) if(m < REACH[i].to) return REACH[i].name;
    return REACH[REACH.length - 1].name;
  }

  /* Matching has to be forgiving or a closed list feels like a quiz that will
     not listen: case, accents, punctuation and a single typo are all let go. */
  function norm(s){
    return String(s || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " and ")
      .replace(/[^a-z0-9 ]/g, "")
      .replace(/\s+/g, " ").trim()
      .replace(/^the /, "");
  }
  function within1(a, b){
    if(Math.abs(a.length - b.length) > 1) return false;
    var i = 0, j = 0, slips = 0;
    while(i < a.length && j < b.length){
      if(a[i] === b[j]){ i++; j++; continue; }
      if(++slips > 1) return false;
      if(a.length > b.length) i++;
      else if(b.length > a.length) j++;
      else { i++; j++; }
    }
    return slips + (a.length - i) + (b.length - j) <= 1;
  }

  // every spelling that counts, mapped to the answer it stands for
  function keyIndex(pack){
    if(pack.__idx) return pack.__idx;
    var idx = [];
    pack.a.forEach(function(ans, rank){
      idx.push({ k: norm(ans), rank: rank });
      ((pack.alt || {})[ans] || []).forEach(function(v){ idx.push({ k: norm(v), rank: rank }); });
    });
    pack.__idx = idx;
    return idx;
  }
  function lookup(pack, said){
    var s = norm(said);
    if(!s) return -1;
    var idx = keyIndex(pack), i;
    for(i = 0; i < idx.length; i++) if(idx[i].k === s) return idx[i].rank;
    for(i = 0; i < idx.length; i++)
      if(s.length >= 5 && within1(s, idx[i].k)) return idx[i].rank;
    return -1;
  }

  function mulberry(seed){
    var t = seed >>> 0;
    return function(){
      t = (t + 0x6D2B79F5) >>> 0;
      var x = Math.imul(t ^ (t >>> 15), 1 | t);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pickPrompts(rng){
    var pool = PACKS.map(function(_, i){ return i; });
    for(var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(rng() * (i + 1)), t = pool[i];
      pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, PROMPTS);
  }
  function today(){
    var d = new Date();
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") +
           "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  function daySeed(s){
    var h = 2166136261;
    for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* ---------- state ---------- */

  function el(id){ return document.getElementById(id); }
  var mode = "daily", order = [], at = 0, flown = 0, said = [], running = false;
  var left = SECONDS, ticker = null, tries = 0;
  var store = { best:{}, daily:null, run:null }, storable = true;

  var MODES = [{ id:"daily", label:"Daily throw" }, { id:"endless", label:"Endless" }];

  function save(){
    if(!storable) return;
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }
    catch(e){ storable = false; el("note").hidden = false; }
  }
  function load(){
    try{ var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ storable = false; el("note").hidden = false; return null; }
  }

  /* ---------- the flight ---------- */

  function buildSky(){
    var sky = el("sky");
    // a few soft banks of cloud: without them the plane crosses a blank panel
    [[8,18,62,17],[34,52,86,22],[58,12,70,15],[76,40,54,14],[20,70,96,20]].forEach(function(c){
      var n = document.createElement("div");
      n.className = "cloud";
      n.style.left = c[0] + "%"; n.style.top = c[1] + "%";
      n.style.width = c[2] + "px"; n.style.height = c[3] + "px";
      sky.appendChild(n);
    });
    REACH.forEach(function(z, i){
      if(i === REACH.length - 1) return;
      var d = document.createElement("div");
      d.className = "mark";
      d.style.left = (3 + z.to / MAX * 91) + "%";
      d.innerHTML = "<b>" + z.to + "m</b>";
      sky.insertBefore(d, el("trail"));
    });
  }
  function paintFlight(lift){
    var x = 3 + Math.min(1, flown / MAX) * 91;
    el("plane").style.left = "calc(" + x + "% - 15px)";
    // a good throw rides higher before it settles
    el("plane").style.bottom = (38 + (lift || 0)) + "%";
    el("trail").style.width = "calc(" + Math.max(0, x - 3) + "% + 6px)";
  }

  /* ---------- a throw ---------- */

  function paintStatus(){
    el("flown-n").textContent = flown;
    var b = store.best[mode];
    el("best-n").textContent = b ? b + "m" : "\u2014";
    el("reach").textContent = reachFor(flown);
    paintFlight(0);
  }

  function showPrompt(){
    var pack = PACKS[order[at]];
    el("qnum").textContent = "Throw " + (at + 1) + " of " + PROMPTS;
    el("tries").textContent = "";
    el("prompt").textContent = pack.q;
    el("verdict").textContent = "";
    el("verdict").dataset.tone = "";
    el("answer").value = "";
    el("answer").disabled = false;
    el("answer").dataset.wrong = "false";
    el("throw").disabled = false;
    tries = 0;
    left = SECONDS;
    paintTimer();
    startClock();
    if(!("ontouchstart" in window)) el("answer").focus();
  }

  function paintTimer(){
    el("timer-bar").style.width = Math.max(0, left / SECONDS * 100) + "%";
    el("timer").dataset.low = left <= 6;
  }
  function startClock(){
    stopClock();
    running = true;
    var last = Date.now();
    ticker = setInterval(function(){
      if(document.hidden){ last = Date.now(); return; }
      var now = Date.now();
      left -= (now - last) / 1000;
      last = now;
      paintTimer();
      if(left <= 0){ left = 0; paintTimer(); timeUp(); }
    }, 100);
  }
  function stopClock(){ running = false; if(ticker){ clearInterval(ticker); ticker = null; } }

  /* A guess that is not on the list costs nothing but the clock. Ending the
     throw on a wrong word punished not knowing the exact wording rather than
     not knowing the answer, and a closed list makes that far too easy to trip
     over. Keep guessing until something lands or the time is gone. */
  function guess(text){
    if(!running) return;
    var pack = PACKS[order[at]];
    if(!String(text).trim()) return;
    var rank = lookup(pack, text);
    if(rank < 0){
      tries++;
      el("tries").textContent = tries + (tries === 1 ? " miss" : " misses");
      var v = el("verdict");
      v.dataset.tone = "wrong";
      v.innerHTML = "<b>" + esc(text.trim()) + "</b> is not on the list \u2014 keep going";
      v.classList.remove("flash"); void v.offsetWidth; v.classList.add("flash");
      var box = el("answer");
      box.dataset.wrong = "true";
      box.value = "";
      setTimeout(function(){ box.dataset.wrong = "false"; }, 320);
      if(!("ontouchstart" in window)) box.focus();
      return;
    }
    land(rank);
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }

  function land(rank){
    stopClock();
    var pack = PACKS[order[at]];
    var t = tierFor(rank, pack.a.length);
    flown += t.pts * PER_POINT;
    said.push({ q:pack.q, said:pack.a[rank], pts:t.pts, tier:t.name,
                best:pack.a[pack.a.length - 1], tries:tries });
    var v = el("verdict");
    v.dataset.tone = "hit";
    v.innerHTML = "<b>" + t.name + " \u00b7 " + (t.pts * PER_POINT) + "m</b> \u2014 " +
      esc(pack.a[rank]) + ", " + (rank + 1) + " of " + pack.a.length + " by fame";
    v.classList.remove("flash"); void v.offsetWidth; v.classList.add("flash");
    el("answer").disabled = true;
    el("throw").disabled = true;
    el("plane").classList.remove("launch"); void el("plane").offsetWidth;
    el("plane").classList.add("launch");
    paintStatus();
    paintFlight(Math.min(22, t.pts * 0.22));
    setTimeout(function(){ paintFlight(0); }, 900);
    advance();
  }

  function timeUp(){
    stopClock();
    var pack = PACKS[order[at]];
    said.push({ q:pack.q, said:"", pts:0, tier:"Out of time",
                best:pack.a[pack.a.length - 1], tries:tries });
    var v = el("verdict");
    v.dataset.tone = "wrong";
    v.innerHTML = "Out of time \u2014 the rarest was <b>" + esc(pack.a[pack.a.length - 1]) + "</b>";
    v.classList.remove("flash"); void v.offsetWidth; v.classList.add("flash");
    el("answer").disabled = true;
    el("throw").disabled = true;
    advance();
  }

  function advance(){
    at++;
    saveRun();
    setTimeout(function(){
      if(at >= PROMPTS) finish(); else showPrompt();
    }, 1700);
  }

  function finish(){
    stopClock();
    el("over-title").textContent = flown >= 640 ? "Over the horizon" : "Landed";
    el("over-text").textContent = flown + " metres \u00b7 " + reachFor(flown).toLowerCase() +
      (flown > (store.best[mode] || 0) ? " \u00b7 your furthest yet" : "");
    if(flown > (store.best[mode] || 0)) store.best[mode] = flown;
    if(mode === "daily") store.daily = { date: today(), flown: flown, said: said };
    store.run = null;

    var r = el("recap");
    r.innerHTML = "";
    said.forEach(function(s, i){
      var row = document.createElement("div");
      row.className = "rec";
      row.dataset.tone = s.pts ? "hit" : "miss";
      row.innerHTML = '<span class="n">' + (i + 1) + "</span>" +
        '<span class="mine">' + esc(s.said || "\u2014") +
        (s.tries ? ' <span class="best">after ' + s.tries + (s.tries === 1 ? " miss" : " misses") + "</span>" : "") +
        '<span class="best">' + esc(s.q.replace(/^Name /, "")) + " \u00b7 rarest: " + esc(s.best) + "</span></span>" +
        '<span class="p">' + (s.pts ? s.pts * PER_POINT + "m" : "0") + "</span>";
      r.appendChild(row);
    });

    el("play").hidden = true;
    el("over").hidden = false;
    el("again").textContent = mode === "daily" ? "Try the endless run" : "Throw again";
    paintStatus();
    save();
  }

  // written down between throws, never inside one: a half-guessed prompt with
  // nine seconds left is not something worth restoring
  function saveRun(){
    if(mode === "daily" && at >= PROMPTS) return;
    store.run = at > 0 && at < PROMPTS
      ? { mode:mode, order:order, at:at, flown:flown, said:said, date:today() }
      : null;
    save();
  }

  function pickPrompts(rng){
    var pool = PACKS.map(function(_, i){ return i; });
    for(var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(rng() * (i + 1)), t = pool[i];
      pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, PROMPTS);
  }
  function today(){
    var d = new Date();
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") +
           "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  function daySeed(s){
    var h = 2166136261;
    for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function start(which){
    mode = which;
    syncChips();
    if(mode === "daily" && store.daily && store.daily.date === today()){
      order = pickPrompts(mulberry(daySeed(today())));
      flown = store.daily.flown;
      said = store.daily.said || [];
      at = PROMPTS;
      finish();
      el("over-text").textContent = flown + " metres \u00b7 " + reachFor(flown).toLowerCase() +
        " \u00b7 today's throw is done";
      return;
    }
    order = mode === "daily" ? pickPrompts(mulberry(daySeed(today())))
                             : pickPrompts(mulberry((Date.now() ^ (Math.random() * 4294967295)) >>> 0));
    at = 0; flown = 0; said = [];
    el("play").hidden = false;
    el("over").hidden = true;
    paintStatus();
    showPrompt();
  }

  function resume(r){
    mode = r.mode;
    syncChips();
    order = r.order; at = r.at; flown = r.flown; said = r.said || [];
    el("play").hidden = false;
    el("over").hidden = true;
    paintStatus();
    showPrompt();
  }

  /* ---------- chrome ---------- */

  var chiprow = el("modes");
  MODES.forEach(function(m){
    var b = document.createElement("button");
    b.className = "chip";
    b.textContent = m.label;
    b.addEventListener("click", function(){ start(m.id); });
    chiprow.appendChild(b);
  });
  function syncChips(){
    for(var i = 0; i < chiprow.children.length; i++)
      chiprow.children[i].setAttribute("aria-pressed", MODES[i].id === mode);
  }

  el("throw").addEventListener("click", function(){ guess(el("answer").value); });
  el("answer").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); guess(el("answer").value); }
  });
  el("again").addEventListener("click", function(){ start("endless"); });

  window.addEventListener("pagehide", saveRun);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) saveRun(); });

  buildSky();
  var saved = load();
  if(saved) store = { best: saved.best || {}, daily: saved.daily || null, run: saved.run || null };
  if(store.run && store.run.order && store.run.at > 0 && store.run.at < PROMPTS &&
     (store.run.mode !== "daily" || store.run.date === today())) resume(store.run);
  else start("daily");

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
